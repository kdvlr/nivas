<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chores Extinguished · Firefighter Rescue</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eaf0f3;color:#4c6077;font-family:ui-rounded,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(1200px,100%)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px}header{margin-bottom:18px}small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#7c8b9c}h1{font-size:clamp(24px,4vw,35px);margin:6px 0}p{font-size:13px;color:#7e8c99}svg{display:block;width:100%;aspect-ratio:16/9;border-radius:24px;border:5px solid #fffaf0;box-shadow:0 20px 55px #52677d20}footer{padding-top:18px}.buttons{display:flex;gap:8px}button{padding:12px 20px;border-radius:25px;border:1px solid #b2c5c9;background:#fffaf0;color:#4f6579;font-weight:700;cursor:pointer}button:last-child{background:#6c8fa0;color:white}button:focus-visible{outline:3px solid #de91ab;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{padding:12px 8px}header p{display:none}footer p{max-width:140px;font-size:11px}button{padding:11px 14px}}body.embed{display:block;min-height:0;padding:0;background:#bbc9df;overflow:hidden}body.embed main{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}body.embed header,body.embed footer,body.embed .sr{display:none}body.embed svg{width:100%;height:100%;max-width:100%;max-height:100%;border:0;border-radius:0;box-shadow:none}</style></head><body><main><header><div><small>A little celebration · Firefighter Rescue</small><h1>A little courage. A splash of teamwork.</h1></div><p>Help is on the way!</p></header><svg id="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="title description"></svg><footer><p>Cool under pressure. Chores extinguished.</p><div class="b render(n,t){const show=(id,v)=>n[id].setAttribute('opacity',v),tr=(id,v)=>n[id].setAttribute('transform',v);let drive=ease(phase(t,.45,2.05)),truckX=mix(1350,828,drive);tr('truck',`translate(${truckX} 445)`);for(let i=0;i<2;i++)tr('wheel'+i,`translate(${i?254:-3} 75) rotate(${-drive*730})`);show('beacon',t<7?.2+.45*Math.sin(t*10)**2:.25);
let door=Math.sin(phase(t,2,3.05)*Math.PI);tr('door',`translate(${-door*18} 0) skewY(${-door*8})`);let hop=ease(phase(t,2.15,3.2)),fx=mix(844,714,hop),fy=442+Math.sin(hop*Math.PI)*-53;show('firefighter',phase(t,2.15,2.3));tr('firefighter',`translate(${fx} ${fy})`);
let spraying=t>=3.4&&t<6.8,aim=phase(t,3.4,6.8),targetY=300+aim*191,targetX=300+Math.sin(aim*Math.PI*4)*70;tr('arms',`rotate(${spraying?mix(18,-10,aim):t>7?-12:0} -42 -4)`);show('hose',phase(t,2.75,3.25));show('hose-light',phase(t,2.75,3.25));let hose=`M1053 494 Q1045 573 865 561 Q690 552 674 450`;n.hose.setAttribute('d',hose);n['hose-light'].setAttribute('d',hose);
for(let i=0;i<8;i++){let p=phase(t,3.65+Math.floor(i/2)*.64,4.35+Math.floor(i/2)*.64),x=Number(n['flame'+i].getAttribute('data-x')),y=Number(n['flame'+i].getAttribute('data-y')),s=Number(n['flame'+i].getAttribute('data-s'));show('flame'+i,1-p);tr('flame'+i,`translate(${x} ${y}) scale(${s*(1+.09*Math.sin(t*12+i))*(1-p*.6)} ${s*(1+.13*Math.sin(t*13+i))*(1-p)})`)}show('fire-glow',1-phase(t,3.7,6.6));
for(let i=0;i<9;i++){let p=(t*.23+i/9)%1;show('smoke'+i,(1-p)*.24*(1-phase(t,4.5,6.8)));tr('smoke'+i,`translate(${224+i%4*51+Math.sin(p*5+i)*17} ${294-p*170}) scale(${.6+p})`)}
show('water',spraying?Math.min(phase(t,3.4,3.65),1-phase(t,6.55,6.8)):0);let angle=(spraying?mix(18,-10,aim):0)*Math.PI/180,nx=714-42-25*Math.cos(angle)+8*Math.sin(angle),ny=442-4-25*Math.sin(angle)-8*Math.cos(angle);let path=`M${nx} ${ny} Q490 ${mix(ny,targetY,.5)-12} ${targetX} ${targetY}`;n['water-fan'].setAttribute('d',`M${nx} ${ny-12} Q490 ${mix(ny,targetY,.5)-54} ${targetX-30} ${targetY-74} Q${targetX-106} ${targetY} ${targetX-30} ${targetY+74} Q490 ${mix(ny,targetY,.5)+54} ${nx} ${ny+12}Z`);tr('impact',`translate(${targetX} ${targetY}) scale(${.9+Math.sin(t*31)*.1})`);n['water-wide'].setAttribute('d',path);n['water-core'].setAttribute('d',path);n['water-core'].setAttribute('stroke-dasharray','55 18');n['water-core'].setAttribute('stroke-dashoffset',t*430);for(let i=0;i<65;i++){let p=(t*2.5+i/65)%1;tr('drop'+i,`translate(${targetX+(i%9-4)*33*p} ${targetY-Math.sin(p*Math.PI)*(45+i%5*18)+p*80}) rotate(${i*21+p*90})`);show('drop'+i,1-p)}show('puddle',phase(t,3.65,6.8));
for(let i=0;i<4;i++)show('check'+i,phase(t,4.1+i*.64,4.45+i*.64));let blinking=t>=6.7&&t<7.45,lit=t<6.7||(blinking&&Math.floor((t-6.7)*12)%2===0);n['sign-text'].setAttribute('fill',lit?'#ffe6a6':'#8f889c');show('sign-glow',lit?.22:0);
show('banner',phase(t,7.45,7.75));tr('banner',`translate(0 ${-35*(1-ease(phase(t,7.45,7.9)))})`);tr('head',`rotate(${t>7.45?Math.sin(t*4)*3:0} 0 -15)`);for(let i=0;i<12;i++){let p=phase(t,7.45+i%3*.06,9.3);show('sparkle'+i,Math.sin(p*Math.PI));tr('sparkle'+i,`translate(${165+i%4*96} ${259+Math.floor(i/4)*87-p*13}) rotate(${p*35})`)}let wipe=ease(phase(t,9.25,10));tr('wipe',`translate(0 ${-wipe*1000})`)
}}};
class CelebrationPlayer {
constructor(svg,{sceneId='firefighter-chore-rescue',loop=true}={}){this.svg=svg;this.scene=scenes[sceneId];this.nodes=this.scene.mount(svg);this.time=0;this.loop=loop;this.running=false;this.destroyed=false;this.visible=true;this.frame=0;this.last=null;this.motion=matchMedia('(prefers-reduced-motion: reduce)');this.tick=now=>{this.frame=0;if(!this.canRun())return;if(this.last!==null)this.time+=(now-this.last)/1000;this.last=now;if(this.time>=this.scene.duration){if(this.loop){this.time%=this.scene.duration;this.announced=false}else{this.time=this.scene.finalTime;this.pause()}}this.render();this.schedule()};this.onVisibility=()=>{this.cancel();this.schedule()};this.onMotion=()=>{this.cancel();this.time=this.motion.matches?this.scene.finalTime:0;this.render();this.update();this.schedule()};document.addEventListener('visibilitychange',this.onVisibility);this.motion.addEventListener('change',this.onMotion);this.observer=new IntersectionObserver(es=>{this.visible=es[0].isIntersecting;this.cancel();this.schedule()});this.observer.observe(svg);this.play()}
canRun(){return this.running&&!this.destroyed&&this.visible&&!document.hidden&&!this.motion.matches}schedule(){if(this.canRun()&&!this.frame)this.frame=requestAnimationFrame(this.tick)}cancel(){cancelAnimationFrame(this.frame);this.frame=0;this.last=null}render(){this.scene.render(this.nodes,this.time);if(this.time>=7.8&&!this.announced){document.getElementById('announcement').textContent=this.scene.description;this.announced=true}}update(){document.getElementById('pause').textContent=this.running&&!this.motion.matches?'Pause':'Play'}play(){if(this.destroyed)return;this.running=true;if(this.motion.matches)this.time=this.scene.finalTime;this.render();this.update();this.schedule()}pause(){this.running=false;this.cancel();this.update()}replay(){if(this.destroyed)return;this.cancel();this.time=this.motion.matches?this.scene.finalTime:0;this.announced=false;this.play()}destroy(){if(this.destroyed)return;this.pause();this.destroyed=true;this.observer.disconnect();document.removeEventListener('visibilitychange',this.onVisibility);this.motion.removeEventListener('change',this.onMotion);this.onDestroy?.()}}
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');const player=new CelebrationPlayer(document.getElementById('scene'));window.firefighterPlayer=player;window.CelebrationPlayer=CelebrationPlayer;window.celebrationScenes=scenes;const toggle=()=>player.running&&!player.motion.matches?player.pause():player.play(),replay=()=>player.replay(),cleanup=()=>player.destroy();document.getElementById('pause').addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',replay);window.addEventListener('pagehide',cleanup);player.onDestroy=()=>{document.getElementById('pause').removeEventListener('click',toggle);document.getElementById('replay').removeEventListener('click',replay);window.removeEventListener('pagehide',cleanup)};
