<g id="sparkles">${Array.from({length:25},(_,i)=>`<g data-spark="${i}">${star(0,0,.3+i%3*.13,['#fff0ad','#fff9ed','#f5c8dd'][i%3])}</g>`).join('')}</g>
<g id="wipe">${['#efb4ca','#f6d0b1','#f8e5ad','#c5e4cd','#b9dbea','#cfc3e9'].map((c,i)=>`<rect x="-1400" y="${i*190-570}" width="2800" height="193" fill="${c}"/>`).join('')}</g>`;
 const nodes={};svg.querySelectorAll('[id]').forEach(n=>nodes[n.id]=n);return nodes;
 },
 render(n,t,svg){const show=(id,v)=>n[id].setAttribute('opacity',v),tr=(id,v)=>n[id].setAttribute('transform',v);
 const powered=t>=1.65,cleared=phase(t,3.85,4.3),final=phase(t,5.25,5.55);
 show('meter-check',powered?1:0);show('meter-empty',powered?0:1);show('ring-check',t>=4.3?1:0);show('ring-empty',t>=4.3?0:1);
 let mp=ease(phase(t,1.1,1.65));show('magic',t>=1.1&&t<1.82?1-phase(t,1.65,1.82):0);tr('magic',`translate(${mix(336,306,mp)} ${mix(140,561,mp)})`);
 show('wing-light',powered?.65+.35*Math.sin(t*8):0);
 tr('start-cloud',`translate(0 ${t>1.7&&t<2?Math.sin(phase(t,1.7,2)*Math.PI)*10:0})`);
 let x=224,y=394,r=0,s=1;
 if(t>=1.8&&t<2){y+=Math.sin(phase(t,1.8,2)*Math.PI)*13;r=-8*phase(t,1.8,2);}
 else if(t>=2&&t<2.75){let p=ease(phase(t,2,2.75));x=mix(224,429,p);y=mix(394,307,p)-Math.sin(p*Math.PI)*25;r=-12*Math.sin(p*Math.PI);s=mix(1,.77,p);}
 else if(t>=2.75&&t<3.6){let p=phase(t,2.75,3.6);if(p<.2){let q=p/.2;x=mix(429,560,q);y=mix(307,225,q);r=-20*q;}else if(p<.8){let a=(p-.2)/.6*Math.PI*2;x=622-62*Math.cos(a);y=225-62*Math.sin(a);r=Math.sin(a)*-28;}else{let q=(p-.8)/.2;x=mix(560,681,q);y=mix(225,241,q);r=0;}s=.77;}
 else if(t>=3.6&&t<4.3){let p=phase(t,3.6,4.3);x=mix(681,811,p);y=mix(241,307,p);s=.77;r=7*Math.sin(p*Math.PI);}
 else if(t>=4.3&&t<5.08){let p=phase(t,4.3,5.08);x=mix(811,899,p);y=mix(307,380,p)-Math.sin(p*Math.PI)*54;r=360*ease(p);s=mix(.77,1,p);}
 else if(t>=5.08){x=899;y=380-Math.sin(phase(t,5.08,5.35)*Math.PI)*-10;r=0;}
 if(t>=6.85){let p=ease(phase(t,6.85,7.6));x=mix(899,570,p);y=mix(380,260,p);s=1+p*5;r=-15*p;}
 tr('horse',`translate(${x} ${y}) rotate(${r}) scale(${s})`);
 let flap=t<1.7?Math.sin(t*3)*4:t<5.1?Math.sin(t*15)*24:Math.sin(t*4)*7;
 if(t>3.8&&t<4.2)flap=Math.sin(phase(t,3.8,4.2)*Math.PI*2)*55;
 tr('front-wing',`rotate(${flap} -5 8)`);tr('back-wing',`rotate(${-flap*.65} 4 1)`);tr('tail',`rotate(${Math.sin(t*8)*9} -50 9)`);tr('legs',`rotate(${t>2&&t<5?Math.sin(t*12)*12:0} 0 25)`);
 show('storm',1-cleared);tr('storm-left',`translate(${-cleared*160} ${-cleared*35}) rotate(${-cleared*20})`);tr('storm-right',`translate(${cleared*160} ${-cleared*35}) rotate(${cleared*20})`);
 show('rainbow',ease(phase(t,5.05,5.5)));show('trail',t>=2&&t<5.25?1:0);
 svg.querySelectorAll('[data-trail]').forEach((a,i)=>a.setAttribute('d',`M224 ${415+i*8} Q${(224+x)/2} ${y-45+i*8} ${x-40*s} ${y+15+i*8}`));
 svg.querySelectorAll('[data-ring-glow]').forEach((a,i)=>{let p=phase(t,[2.55,3.16,4.3][i],[2.95,3.6,4.72][i]);a.setAttribute('opacity',Math.sin(p*Math.PI));a.setAttribute('transform',`scale(${1+p*.3})`);});
 show('message',final);tr('message',`translate(0 ${(1-ease(final))*-20})`);
 show('crown',phase(t,5.1,5.4));tr('crown',`translate(936 ${277+Math.sin(t*3)*3})`);
 show('ponies',final);show('ribbons',final);svg.querySelectorAll('[data-pony]').forEach((p,i)=>{let side=Number(p.dataset.pony),px=600+side*215,py=228+Math.sin(t*4+i*2)*12;p.setAttribute('transform',`translate(${px} ${py}) scale(${side<0?1:-1} 1)`);n[i?'ribbon-right':'ribbon-left'].setAttribute('d',`M${px+side*30} ${py+5} Q${px+side*65} ${py+55} ${px+side*110} ${py+25}`);});
 svg.querySelectorAll('[data-pony-wing]').forEach((p,i)=>p.setAttribute('transform',`rotate(${Math.sin(t*12+i)*18})`));
 svg.querySelectorAll('[data-spark]').forEach((p,i)=>{let q=phase(t,5.1+(i%4)*.05,7);p.setAttribute('opacity',Math.sin(q*Math.PI));p.setAttribute('transform',`translate(${260+(i*73)%700} ${270+(i%5)*45+q*35}) rotate(${q*90})`);});
 let wipe=ease(phase(t,7.05,7.6));show('wipe',wipe?1:0);tr('wipe',`translate(${mix(-2100,600,wipe)} 337) rotate(-20)`);
 }

/** Shared, lifecycle-aware player. Scenes own only vector artwork and their timeline. */
class CelebrationPlayer{
 constructor(svg,{sceneId='pegasus-cloud-dash',colorVariation='strawberry',childName='',loop=true,onStateChange=()=>{}}={}){
  if(!scenes[sceneId])throw new Error('Unknown celebration scene');
  this.svg=svg;this.scene=scenes[sceneId];this.loop=loop;this.onStateChange=onStateChange;this.time=0;this.running=false;this.destroyed=false;this.visible=true;this.frame=0;this.last=null;this.announced=false;
  const p=palettes[colorVariation]||palettes.strawberry;Object.entries(p).forEach(([k,v])=>svg.style.setProperty('--'+k,v));this.nodes=this.scene.mount(svg);this.nodes['child-label'].textContent=childName?`Well done, ${String(childName).slice(0,32)}!`:'';
  this.motion=matchMedia('(prefers-reduced-motion: reduce)');
  this.tick=now=>{this.frame=0;if(!this.canRun()){this.last=null;return}if(this.last!==null)this.time+=(now-this.last)/1000;this.last=now;if(this.time>=this.scene.duration){if(this.loop){this.time%=this.scene.duration;this.announced=false}else{this.time=6.6;this.running=false;this.onStateChange(false)}}this.render();this.schedule();};
  this.onVisibility=()=>{this.cancel();this.schedule()};this.onMotion=()=>{this.cancel();if(this.motion.matches){this.time=6.4;this.render()}else if(this.running){this.time=0;this.render();this.schedule()}this.onStateChange(this.running&&!this.motion.matches)};
  document.addEventListener('visibilitychange',this.onVisibility);this.motion.addEventListener('change',this.onMotion);
  this.observer=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;this.cancel();this.schedule()});this.observer.observe(svg);
  this.onPageHide=()=>this.destroy();window.addEventListener('pagehide',this.onPageHide,{once:true});this.render();this.play();
 }
 canRun(){return this.running&&!this.destroyed&&this.visible&&!document.hidden&&!this.motion.matches}
 schedule(){if(this.canRun()&&!this.frame)this.frame=requestAnimationFrame(this.tick)}
 cancel(){cancelAnimationFrame(this.frame);this.frame=0;this.last=null}
 render(){this.scene.render(this.nodes,this.time,this.svg);if(this.time>=5.4&&!this.announced){document.getElementById('announcement').textContent=this.scene.description;this.announced=true}}
 play(){if(this.destroyed)return;this.running=true;if(this.motion.matches){this.time=6.4;this.render()}this.onStateChange(!this.motion.matches);this.schedule()}
 pause(){if(this.destroyed)return;this.running=false;this.cancel();this.onStateChange(false)}
 replay(){if(this.destroyed)return;this.cancel();this.time=this.motion.matches?6.4:0;this.announced=false;this.render();this.play()}
 destroy(){if(this.destroyed)return;this.pause();this.destroyed=true;this.observer.disconnect();document.removeEventListener('visibilitychange',this.onVisibility);this.motion.removeEventListener('change',this.onMotion);window.removeEventListener('pagehide',this.onPageHide);this.onDestroy?.()}
}
window.CelebrationPlayer=CelebrationPlayer;window.celebrationScenes=scenes;
const pauseButton=document.getElementById('pause');
const player=new CelebrationPlayer(document.getElementById('scene'),{onStateChange:playing=>{pauseButton.textContent=playing?'Pause':'Play';pauseButton.setAttribute('aria-label',playing?'Pause animation':'Play animation')}});
window.pegasusPlayer=player;
const toggle=()=>player.running&&!player.motion.matches?player.pause():player.play();const replay=()=>player.replay();
pauseButton.addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',replay);player.onDestroy=()=>{pauseButton.removeEventListener('click',toggle);document.getElementById('replay').removeEventListener('click',replay)};
</script></body></html>
