<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chore Celebration Animation Collection — 20 Standalone Scenes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    :root {
      --bg: #090d16;
      --surface: #121826;
      --surface-variant: #1e293b;
      --primary: #38bdf8;
      --secondary: #f59e0b;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header.app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #4ade80, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-controls { display: flex; align-items: center; gap: 10px; }
    .child-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-variant);
      padding: 4px 12px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .child-input-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .child-input-group input {
      background: transparent; border: none; color: #fff; font-size: 0.85rem; font-weight: 700; width: 90px; outline: none;
    }
    .layout-container { display: flex; flex: 1; height: calc(100vh - 54px); max-height: calc(100vh - 54px); overflow: hidden; }
    aside.sidebar {
      width: 380px;
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }
    .search-box {
      width: 100%;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .category-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .category-chip {
      background: var(--surface-variant);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .category-chip:hover { color: #fff; border-color: var(--border); }
    .category-chip.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .scene-list { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .scene-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scene-item:hover { background: rgba(30, 41, 59, 0.9); border-color: rgba(56, 189, 248, 0.3); transform: translateX(2px); }
    .scene-item.active { background: rgba(2, 132, 199, 0.2); border-color: #38bdf8; }
    .scene-emoji {
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      flex-shrink: 0;
    }
    .scene-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .scene-num-title { display: flex; align-items: center; gap: 6px; }
    .scene-num { font-size: 0.7rem; font-weight: 700; color: var(--primary); }
    .scene-title { font-size: 0.85rem; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scene-message { font-size: 0.72rem; color: #38bdf8; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main.viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    main.viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      overflow-y: auto;
      gap: 12px;
      background: #060910;
      height: 100%;
    }
    .stage-card {
      position: relative;
      height: min(calc(100vh - 280px), 640px);
      aspect-ratio: 16 / 9;
      width: auto;
      max-width: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    canvas#stageCanvas { width: 100%; height: 100%; display: block; }
    .fullscreen-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }
    .fullscreen-btn:hover { opacity: 1; }

    .controls-panel {
      width: 100%;
      max-width: 1100px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-bar { display: flex; align-items: center; gap: 14px; width: 100%; }
    .time-indicator { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; color: var(--primary); min-width: 72px; }
    .scrubber-wrap { position: relative; flex: 1; height: 28px; display: flex; align-items: center; cursor: pointer; }
    .scrubber-rail { position: absolute; width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
    .scrubber-fill { position: absolute; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22c55e, #facc15); border-radius: 3px; }
    .phase-markers { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    .p-marker { position: absolute; top: 50%; transform: translateY(-50%); width: 2px; height: 10px; background: rgba(255, 255, 255, 0.35); }
    .p-label { position: absolute; top: -14px; transform: translateX(-50%); font-size: 0.65rem; color: #64748b; font-weight: 600; white-space: nowrap; }
    .scrubber-knob { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); top: 50%; transform: translate(-50%, -50%); pointer-events: none; }

    .playback-buttons { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .btn-row { display: flex; align-items: center; gap: 8px; }
    button.btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button.btn:hover { background: #334155; border-color: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }
    button.btn.primary { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: #38bdf8; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35); }
    .speed-selector { display: flex; background: #0f172a; border-radius: 8px; padding: 2px; border: 1px solid var(--border); }
    .s-btn { background: transparent; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; color: #94a3b8; cursor: pointer; }
    .s-btn.active { background: #3b82f6; color: #fff; }

    .scene-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }
    .symbol-preview { display: inline-flex; align-items: center; gap: 6px; font-family: monospace; font-size: 1rem; color: #facc15; }

    @media (max-width: 900px) {
      .layout-container { flex-direction: column-reverse; height: auto; }
      aside.sidebar { width: 100%; height: 320px; }
    }
  </style>
</head>
<body>

  <header class="app-bar">
    <div class="brand-title">
      <span>✨</span>
      <span>Chore Celebration Animation Collection</span>
    </div>
    <div class="header-controls">
      <div class="child-input-group">
        <label for="childNameInput">Child:</label>
        <input type="text" id="childNameInput" value="Leo" maxlength="16" />
      </div>
      <button class="btn" id="randomSceneBtn">🎲 Random</button>
      <button class="btn" id="nextSceneBtn">Next ❯</button>
    </div>
  </header>

  <div class="layout-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-box" id="searchBox" placeholder="Search 20 celebrations..." />
        <div class="category-chips">
          <div class="category-chip active" data-cat="all">All (20)</div>
          <div class="category-chip" data-cat="action">Action</div>
          <div class="category-chip" data-cat="animals">Animals</div>
          <div class="category-chip" data-cat="fantasy">Fantasy</div>
          <div class="category-chip" data-cat="tech">Tech & Space</div>
        </div>
      </div>
      <div class="scene-list" id="sceneList"></div>
    </aside>

    <main class="viewport">
      <div class="stage-card" id="stageCard">
        <canvas id="stageCanvas"></canvas>
        <button class="fullscreen-btn" id="fsBtn">⛶ Fullscreen</button>
      </div>

      <div class="controls-panel">
        <div class="timeline-bar">
          <div class="time-indicator" id="timeDisplay">0.00s / 7.60s</div>
          <div class="scrubber-wrap" id="scrubberWrap">
            <div class="scrubber-rail">
              <div class="scrubber-fill" id="scrubberFill"></div>
            </div>
            <div class="phase-markers">
              <div class="p-marker" style="left: 0%;"><span class="p-label">Setup (0.0s)</span></div>
              <div class="p-marker" style="left: 15.78%;"><span class="p-label">Action (1.2s)</span></div>
              <div class="p-marker" style="left: 56.57%;"><span class="p-label">Celebration (4.3s)</span></div>
              <div class="p-marker" style="left: 89.47%;"><span class="p-label">Reset (6.8s)</span></div>
            </div>
            <div class="scrubber-knob" id="scrubberKnob"></div>
          </div>
        </div>

        <div class="playback-buttons">
          <div class="btn-row">
            <button class="btn primary" id="playBtn">
              <span id="playIcon">⏸</span> <span id="playText">Pause</span>
            </button>
            <button class="btn" id="restartBtn">↺ Replay</button>
            <button class="btn" id="stepBackBtn">⏮ -0.25s</button>
            <button class="btn" id="stepFwdBtn">⏭ +0.25s</button>
          </div>

          <div class="btn-row">
            <div class="speed-selector">
              <button class="s-btn" data-speed="0.25">0.25x</button>
              <button class="s-btn" data-speed="0.5">0.5x</button>
              <button class="s-btn active" data-speed="1.0">1.0x</button>
              <button class="s-btn" data-speed="1.5">1.5x</button>
            </div>
            <button class="btn" id="soundBtn">🔊 Sound: ON</button>
            <button class="btn" id="motionBtn">⚡ Reduced Motion: OFF</button>
          </div>
        </div>

        <div class="scene-meta-bar">
          <div id="sceneDesc">Active Scene Details</div>
          <div class="symbol-preview">
            <span>Symbol Progress:</span>
            <span id="symbolState">✓  ✓  ✓  □</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // =========================================================================
    // 1. WEB AUDIO PROCEDURAL SYNTHESIS ENGINE
    // =========================================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastTriggers = {};
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      tone(freq, dur = 0.15, type = 'sine', gainVal = 0.3) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          g.gain.setValueAtTime(gainVal, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (e) {}
      }
      chord(freqs, dur = 0.6) {
        if (!this.enabled || !this.ctx) return;
        freqs.forEach(f => this.tone(f, dur, 'triangle', 0.25 / freqs.length));
      }
      noise(dur = 0.2, gainVal = 0.3, highpass = 400) {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * dur;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = highpass;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(gainVal, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          src.connect(filter);
          filter.connect(g);
          g.connect(this.ctx.destination);
          src.start(now);
        } catch (e) {}
      }
      playImpact() {
        this.tone(110, 0.28, 'sine', 0.6);
        this.noise(0.12, 0.4, 250);
      }
      playSuccess() {
        this.chord([523.25, 659.25, 783.99, 1046.50], 0.8);
      }
      playWhoosh() {
        this.tone(280, 0.35, 'sawtooth', 0.15);
      }
      sync(t, prevT) {
        if (t < prevT) this.lastTriggers = {};
        if (t >= 1.2 && !this.lastTriggers['action']) {
          this.lastTriggers['action'] = true;
          this.tone(440, 0.1, 'triangle', 0.2);
        }
        if (t >= 4.25 && !this.lastTriggers['success']) {
          this.lastTriggers['success'] = true;
          this.playImpact();
          setTimeout(() => this.playSuccess(), 80);
        }
        if (t >= 6.78 && !this.lastTriggers['wipe']) {
          this.lastTriggers['wipe'] = true;
          this.playWhoosh();
        }
      }
    }
    const sound = new SoundFX();

    // =========================================================================
    // 2. CANVAS COORDINATES & MATH UTILS
    // =========================================================================
    const V_W = 1280;
    const V_H = 720;
    const DURATION = 7.6;

    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOutQuad = t => t * (2 - t);
    const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
    const easeOutBack = (t, s = 1.7) => {
      const t1 = t - 1;
      return t1 * t1 * ((s + 1) * t1 + s) + 1;
    };
    const easeOutBounce = t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    };

    function drawCheckmark(ctx, x, y, size, color, strokeW = 4) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = color;
      ctx.lineWidth = strokeW;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-size * 0.38, 0);
      ctx.lineTo(-size * 0.08, size * 0.35);
      ctx.lineTo(size * 0.45, -size * 0.38);
      ctx.stroke();
      ctx.restore();
    }

    // Strict Chore Symbol Invariant: Render ONLY neutral task tiles (✓ ✓ ✓ □ -> ✓ ✓ ✓ ✓)
    function drawTaskTiles(ctx, x, y, t, theme = {}) {
      const isComplete = t >= 4.3;
      const flipAnim = (t >= 3.8 && t < 4.3) ? (t - 3.8) / 0.5 : (isComplete ? 1 : 0);
      const tiles = ['✓', '✓', '✓', isComplete ? '✓' : '□'];

      ctx.save();
      ctx.translate(x, y);

      const tileW = 54;
      const tileGap = 16;
      const totalW = 4 * tileW + 3 * tileGap;
      const startX = -totalW / 2 + tileW / 2;

      ctx.fillStyle = theme.cardBg || 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = theme.border || 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-totalW / 2 - 14, -tileW / 2 - 10, totalW + 28, tileW + 20, 16);
      ctx.fill();
      ctx.stroke();

      tiles.forEach((sym, idx) => {
        const tx = startX + idx * (tileW + tileGap);
        ctx.save();
        ctx.translate(tx, 0);

        if (idx === 3 && flipAnim > 0 && flipAnim < 1) {
          ctx.scale(1, Math.cos(flipAnim * Math.PI));
        }

        if (idx === 3 && !isComplete) {
          const pulse = Math.sin(t * 8) * 0.25 + 0.75;
          ctx.fillStyle = `rgba(239, 68, 68, ${0.15 * pulse})`;
          ctx.strokeStyle = `rgba(239, 68, 68, ${0.85 * pulse})`;
          ctx.lineWidth = 2.5;
        } else {
          ctx.fillStyle = 'rgba(34, 197, 94, 0.18)';
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2;
        }

        ctx.beginPath();
        ctx.roundRect(-tileW / 2, -tileW / 2, tileW, tileW, 10);
        ctx.fill();
        ctx.stroke();

        if (sym === '✓') {
          drawCheckmark(ctx, 0, 0, 24, '#22c55e', 3.5);
        } else {
          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('□', 0, -1);
        }
        ctx.restore();
      });

      ctx.restore();
    }

    // High-contrast, room-readable final celebration banner
    function drawCelebrationMessage(ctx, t, mainText, subText, childName, colorTheme = {}) {
      if (t < 4.3 || t >= 6.8) return;

      const enterProg = clamp((t - 4.3) / 0.5, 0, 1);
      const scale = easeOutBack(enterProg, 1.8);

      ctx.save();
      ctx.translate(V_W / 2, 280);
      ctx.scale(scale, scale);

      const ribbonGrad = ctx.createLinearGradient(-460, 0, 460, 0);
      ribbonGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      ribbonGrad.addColorStop(0.15, colorTheme.ribbonBg || 'rgba(10, 15, 29, 0.95)');
      ribbonGrad.addColorStop(0.85, colorTheme.ribbonBg || 'rgba(10, 15, 29, 0.95)');
      ribbonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = ribbonGrad;
      ctx.beginPath();
      ctx.roundRect(-460, -95, 920, 190, 28);
      ctx.fill();

      // Bold contrast outline
      ctx.font = '900 68px -apple-system, Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 14;
      ctx.strokeText(mainText, 0, -22);

      const grad = ctx.createLinearGradient(0, -60, 0, 20);
      grad.addColorStop(0, colorTheme.textGrad1 || '#ffffff');
      grad.addColorStop(0.5, colorTheme.textGrad2 || '#fde047');
      grad.addColorStop(1, colorTheme.textGrad3 || '#ea580c');
      ctx.fillStyle = grad;
      ctx.fillText(mainText, 0, -22);

      if (t >= 4.7) {
        const subProg = clamp((t - 4.7) / 0.4, 0, 1);
        const subScale = easeOutBounce(subProg);

        ctx.save();
        ctx.translate(0, 48);
        ctx.scale(subScale, subScale);

        const fullSub = childName ? `${childName.toUpperCase()} — ${subText}` : `★ ${subText} ★`;
        ctx.font = '900 28px sans-serif';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;
        ctx.strokeText(fullSub, 0, 0);

        ctx.fillStyle = colorTheme.subColor || '#22c55e';
        ctx.fillText(fullSub, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    // Confetti burst
    function drawConfetti(ctx, t, startT, count = 50, colors = ['#facc15', '#38bdf8', '#22c55e', '#ec4899', '#ffffff']) {
      if (t < startT || t >= 6.8) return;
      const elapsed = t - startT;
      ctx.save();
      for (let i = 0; i < count; i++) {
        const fromLeft = i % 2 === 0;
        const originX = fromLeft ? 60 : V_W - 60;
        const originY = V_H - 80;

    // Scene-specific wipe transitions

      const scale = easeInOutCubic(wipeProg);

      ctx.save();
      if (type === 'smoke') {
        const r = scale * 1050;
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(V_W / 2, V_H / 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(V_W / 2, V_H / 2, r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'ball') {
        const gx = 1350 - scale * (1350 - V_W / 2);
        const gy = 760 - scale * (760 - V_H / 2);
        const r = 40 + scale * 1150;
        ctx.beginPath();
        ctx.arc(gx, gy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(gx, gy, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'tire') {
        const r = scale * 1000;
        ctx.beginPath();
        ctx.arc(V_W / 2, V_H / 2, r, 0, Math.PI * 2);
        ctx.fillStyle = '#090d16';
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 20 * scale;
        ctx.stroke();
      } else if (type === 'iris') {
        const maxR = Math.hypot(V_W, V_H);
        ctx.beginPath();
        ctx.arc(V_W / 2, V_H / 2, scale * maxR, 0, Math.PI * 2);
        ctx.fillStyle = '#0369a1';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 15;
        ctx.stroke();
      } else if (type === 'parchment') {
        const h = V_H * scale;
        ctx.fillStyle = '#d97706';
        ctx.fillRect(0, 0, V_W, h);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, h - 16, V_W, 16);
      } else if (type === 'wave') {
        const wx = V_W * (1 - scale);
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(wx, 0);
        ctx.lineTo(V_W, 0);
        ctx.lineTo(V_W, V_H);
        ctx.lineTo(wx - 90, V_H);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'firework') {
        const r = scale * 1100;
        ctx.beginPath();
        ctx.arc(V_W / 2, V_H / 2, r, 0, Math.PI * 2);
        ctx.fillStyle = '#581c87';
        ctx.fill();
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 24 * scale;
        ctx.stroke();
      } else if (type === 'warp') {
        ctx.fillStyle = `rgba(15, 23, 42, ${scale})`;
        ctx.fillRect(0, 0, V_W, V_H);
        for (let i = 0; i < 40; i++) {
          const ang = (i / 40) * Math.PI * 2;
          const len = scale * 800;
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(V_W / 2, V_H / 2);
          ctx.lineTo(V_W / 2 + Math.cos(ang) * len, V_H / 2 + Math.sin(ang) * len);
          ctx.stroke();
        }
      } else if (type === 'blueprint') {
        const h = V_H * scale;
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(0, 0, V_W, h);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        for (let x = 0; x < V_W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
      } else if (type === 'cape') {
        const cx = scale * (V_W + 300);
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(cx, 0);
        ctx.lineTo(cx - 200, V_H);
        ctx.lineTo(0, V_H);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'cloud') {
        const cx = -300 + scale * (V_W + 600);
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(cx, V_H / 2, 600, 0, Math.PI * 2);

      } else if (type === 'curtain') {

        ctx.fillRect(V_W - w, 0, w, V_H);

        if (scale > 0.6) {

          ctx.fillRect(200, V_H - 180, V_W - 400, 30);
          ctx.fillStyle = '#78350f';
          ctx.fillRect(220, V_H - 150, V_W - 440, 150);

          // Blackboard recipe card checklist
          drawTaskTiles(ctx, V_W / 2, 70, t, { cardBg: 'rgba(120, 53, 15, 0.95)', border: '#f59e0b' });

          // 3-Tier Celebration Cake on marble turntable
          const cakeX = V_W / 2 + 160;
          const cakeY = V_H - 180;
          const topperPlaced = t >= 3.8;
          ctx.save();
          ctx.translate(cakeX, cakeY);

          // Tier 1 (Base)
          ctx.fillStyle = '#fde68a';
          ctx.fillRect(-65, -40, 130, 40);
          // Tier 2 (Middle)
          ctx.fillStyle = '#fbcfe8';
          ctx.fillRect(-45, -75, 90, 35);
          // Tier 3 (Top)
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-25, -105, 50, 30);

          // Crown checkmark chocolate topper
          if (topperPlaced) {
            ctx.fillStyle = '#78350f';
            ctx.beginPath(); ctx.arc(0, -125, 20, 0, Math.PI * 2); ctx.fill();
            drawCheckmark(ctx, 0, -125, 20, '#facc15', 4);
          }
          ctx.restore();

          // Bear Baker Chef
          ctx.save();
          ctx.translate(V_W / 2 - 120, V_H - 200);

          // Brown fur body
          ctx.fillStyle = '#78350f';
          ctx.beginPath(); ctx.ellipse(0, 20, 48, 42, 0, 0, Math.PI * 2); ctx.fill();
          // White apron
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(-24, 0, 48, 55);

          // Head & round ears
          ctx.fillStyle = '#92400e';
          ctx.beginPath(); ctx.arc(20, -35, 30, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(0, -60, 12, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(40, -60, 12, 0, Math.PI * 2); ctx.fill();

          // Tall white chef's toque hat
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath(); ctx.roundRect(5, -95, 30, 40, [12, 12, 0, 0]); ctx.fill();

          // Piping bag in paws
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.moveTo(35, -5); ctx.lineTo(65, -15); ctx.lineTo(60, 15); ctx.closePath();
          ctx.fill();

          ctx.restore();

          // Celebration
          drawConfetti(ctx, t, 4.3, 70, ['#f59e0b', '#fbcfe8', '#38bdf8', '#ffffff']);
          drawCelebrationMessage(ctx, t, 'SWEET VICTORY! BAKED TO PERFECTION!', 'The Grand Prize Confection', childName, {
            ribbonBg: 'rgba(120, 53, 15, 0.95)',
            textGrad1: '#ffffff',
            textGrad2: '#fde68a',
            textGrad3: '#d97706',
            subColor: '#fde68a'
          });

          drawWipe(ctx, t, 'frosting', '#d97706');
        }
      }
    );

    // =========================================================================
    // 7. MASTER PLAYER CONTROLLER & UI BINDINGS
    // =========================================================================
    class CelebrationPlayer {
      constructor() {
        this.canvas = document.getElementById('stageCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.activeIdx = 0;
        this.t = 0;
        this.prevT = 0;
        this.isPlaying = true;
        this.speed = 1.0;
        this.reducedMotion = false;
        this.soundEnabled = true;
        this.childName = 'Leo';
        this.isDragging = false;
        this.activeCategory = 'all';
        this.searchQuery = '';
        this.lastFrameTime = performance.now();

        this.initDOM();
        this.initCanvasResize();
        this.renderSceneList();
        this.selectScene(0);
        this.bindEvents();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      initDOM() {
        this.playBtn = document.getElementById('playBtn');
        this.playIcon = document.getElementById('playIcon');
        this.playText = document.getElementById('playText');
        this.restartBtn = document.getElementById('restartBtn');
        this.stepBackBtn = document.getElementById('stepBackBtn');
        this.stepFwdBtn = document.getElementById('stepFwdBtn');
        this.timeDisplay = document.getElementById('timeDisplay');
        this.scrubberWrap = document.getElementById('scrubberWrap');
        this.scrubberFill = document.getElementById('scrubberFill');
        this.scrubberKnob = document.getElementById('scrubberKnob');
        this.soundBtn = document.getElementById('soundBtn');
        this.motionBtn = document.getElementById('motionBtn');
        this.childInput = document.getElementById('childNameInput');
        this.sceneDesc = document.getElementById('sceneDesc');
        this.symbolState = document.getElementById('symbolState');
        this.sceneList = document.getElementById('sceneList');
        this.searchBox = document.getElementById('searchBox');
        this.fsBtn = document.getElementById('fsBtn');
        this.nextSceneBtn = document.getElementById('nextSceneBtn');
        this.randomSceneBtn = document.getElementById('randomSceneBtn');
      }

      initCanvasResize() {
        const resize = () => {
          const rect = this.canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          this.canvas.width = rect.width * dpr;
          this.canvas.height = rect.height * dpr;
          this.scaleX = this.canvas.width / V_W;
          this.scaleY = this.canvas.height / V_H;
        };
        window.addEventListener('resize', resize);
        resize();
      }

      renderSceneList() {
        this.sceneList.innerHTML = '';
        const q = this.searchQuery.toLowerCase().trim();
        const filtered = CELEBRATIONS.filter(s => {
          const matchesCat = (this.activeCategory === 'all' || s.category === this.activeCategory);
          const matchesQuery = (!q || s.name.toLowerCase().includes(q) || s.finalMsg.toLowerCase().includes(q));
          return matchesCat && matchesQuery;
        });

        filtered.forEach(s => {
          const item = document.createElement('div');
          item.className = `scene-item ${s.num - 1 === this.activeIdx ? 'active' : ''}`;
          item.dataset.index = s.num - 1;
          item.innerHTML = `
            <div class="scene-emoji">${s.emoji}</div>
            <div class="scene-info">
              <div class="scene-num-title">
                <span class="scene-num">#${s.num}</span>
                <span class="scene-title">${s.name}</span>
              </div>
              <span class="scene-message">${s.finalMsg}</span>
            </div>
          `;
          item.addEventListener('click', () => {
            this.selectScene(s.num - 1);
          });
          this.sceneList.appendChild(item);
        });
      }

      selectScene(idx) {
        this.activeIdx = idx;
        this.t = 0;
        this.prevT = 0;
        sound.lastTriggers = {};
        const scene = CELEBRATIONS[this.activeIdx];
        this.sceneDesc.innerHTML = `<strong>#${scene.num} ${scene.name}</strong> (${scene.category.toUpperCase()}) — <em>${scene.finalMsg}</em>`;
        document.querySelectorAll('.scene-item').forEach(el => {
          el.classList.toggle('active', parseInt(el.dataset.index) === idx);
        });
      }

      play() {
        this.isPlaying = true;
        this.playIcon.textContent = '⏸';
        this.playText.textContent = 'Pause';
        this.lastFrameTime = performance.now();
      }

      pause() {
        this.isPlaying = false;
        this.playIcon.textContent = '▶';
        this.playText.textContent = 'Play';
      }

      togglePlay() {
        if (this.isPlaying) this.pause();
        else {
          sound.init();
          this.play();
        }
      }

      replay() {
        this.t = 0;
        this.prevT = 0;
        sound.lastTriggers = {};
        this.play();
      }

      step(delta) {
        this.pause();
        this.t = clamp(this.t + delta, 0, DURATION);
      }

      setSpeed(spd) {
        this.speed = spd;
        document.querySelectorAll('.s-btn').forEach(btn => {
          btn.classList.toggle('active', parseFloat(btn.dataset.speed) === spd);
        });
      }

      toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        sound.enabled = this.soundEnabled;
        this.soundBtn.textContent = this.soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      }

      toggleReducedMotion() {
        this.reducedMotion = !this.reducedMotion;
        this.motionBtn.textContent = this.reducedMotion ? '⚡ Reduced Motion: ON' : '⚡ Reduced Motion: OFF';
      }

      seekAtPoint(e) {
        const rect = this.scrubberWrap.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
        this.t = ratio * DURATION;
      }

      bindEvents() {
        this.playBtn.addEventListener('click', () => this.togglePlay());
        this.restartBtn.addEventListener('click', () => this.replay());
        this.stepBackBtn.addEventListener('click', () => this.step(-0.25));
        this.stepFwdBtn.addEventListener('click', () => this.step(0.25));

        document.querySelectorAll('.s-btn').forEach(btn => {
          btn.addEventListener('click', () => this.setSpeed(parseFloat(btn.dataset.speed)));
        });

        this.soundBtn.addEventListener('click', () => this.toggleSound());
        this.motionBtn.addEventListener('click', () => this.toggleReducedMotion());

        this.childInput.addEventListener('input', e => {
          this.childName = e.target.value.trim() || 'Leo';
        });

        // Scrubber drag / click
        const onDown = e => {
          this.isDragging = true;
          this.seekAtPoint(e);
        };
        const onMove = e => {
          if (this.isDragging) this.seekAtPoint(e);
        };
        const onUp = () => {
          this.isDragging = false;
        };

        this.scrubberWrap.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        this.scrubberWrap.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp);

        // Category filter chips
        document.querySelectorAll('.category-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            this.activeCategory = chip.dataset.cat;
            this.renderSceneList();
          });
        });

        // Search box
        this.searchBox.addEventListener('input', e => {
          this.searchQuery = e.target.value;
          this.renderSceneList();
        });

        // Navigation
        this.nextSceneBtn.addEventListener('click', () => {
          this.selectScene((this.activeIdx + 1) % CELEBRATIONS.length);
        });
        this.randomSceneBtn.addEventListener('click', () => {
          const rand = Math.floor(Math.random() * CELEBRATIONS.length);
          this.selectScene(rand);
        });

        // Fullscreen
        this.fsBtn.addEventListener('click', () => {
          const stage = document.getElementById('stageCard');
          if (!document.fullscreenElement) {
            if (stage.requestFullscreen) stage.requestFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
          }
        });

        // Keyboard navigation
        window.addEventListener('keydown', e => {
          if (document.activeElement === this.childInput || document.activeElement === this.searchBox) return;
          if (e.code === 'Space') {
            e.preventDefault();
            this.togglePlay();
          } else if (e.code === 'ArrowLeft') {
            this.step(-0.25);
          } else if (e.code === 'ArrowRight') {
            this.step(0.25);
          } else if (e.key === 'r' || e.key === 'R') {
            this.replay();
          } else if (e.key === 'n' || e.key === 'N') {
            this.selectScene((this.activeIdx + 1) % CELEBRATIONS.length);
          }
        });
      }

      loop(now) {
        const dt = (now - this.lastFrameTime) / 1000;
        this.lastFrameTime = now;

        if (this.isPlaying && !this.isDragging) {
          this.prevT = this.t;
          this.t += dt * this.speed;
          if (this.t >= DURATION) {
            this.t = 0;
            sound.lastTriggers = {};
          }
          sound.sync(this.t, this.prevT);
        }

        // Render Canvas
        this.ctx.save();
        this.ctx.scale(this.scaleX, this.scaleY);
        this.ctx.clearRect(0, 0, V_W, V_H);

        const currentScene = CELEBRATIONS[this.activeIdx];
        if (currentScene && typeof currentScene.draw === 'function') {
          currentScene.draw(this.ctx, this.t, this.childName, this.reducedMotion);
        }
        this.ctx.restore();

        // Update Scrubber & Readout
        const pct = (this.t / DURATION) * 100;
        this.scrubberFill.style.width = `${pct}%`;
        this.scrubberKnob.style.left = `${pct}%`;
        this.timeDisplay.textContent = `${this.t.toFixed(2)}s / ${DURATION.toFixed(2)}s`;

        // Update Neutral Symbol Status Readout
        if (this.t >= 4.3) {
          this.symbolState.textContent = '✓  ✓  ✓  ✓  (COMPLETE)';
          this.symbolState.style.color = '#22c55e';
        } else {
          this.symbolState.textContent = '✓  ✓  ✓  □  (IN PROGRESS)';
          this.symbolState.style.color = '#facc15';
        }

        requestAnimationFrame(this.loop);
      }
    }

    // Auto-boot on load
    window.addEventListener('DOMContentLoaded', () => {
      window.player = new CelebrationPlayer();
    });
  </script>
