<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Cream Tragedy · Chore Penalty Celebration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #f43f5e;
      --primary-dark: #be123c;
      --surface: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.94);
      --border-glow: rgba(244, 63, 94, 0.6);
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0f172a;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stage-container {
      width: min(100vw, 1200px);
      aspect-ratio: 16 / 9;
      max-height: 92vh;
      background: radial-gradient(circle at 50% 25%, #38bdf8 0%, #0284c7 45%, #0369a1 75%, #0f172a 100%);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(244, 63, 94, 0.3);
      position: relative;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-bar {
      position: absolute;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      padding: 8px 22px;
      border-radius: 9999px;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .controls-bar button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls-bar button:hover {
      background: rgba(244, 63, 94, 0.3);
      border-color: #f43f5e;
      color: #fecdd3;
      transform: translateY(-1px);
    }

    .controls-bar button.primary {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-color: #fb7185;
      color: #fff;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.45);
    }

    .controls-bar .points-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 700;
      font-family: 'Fredoka', cursive;
    }

    .controls-bar input[type="number"] {
      width: 52px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #fb7185;
      font-weight: 800;
      font-size: 15px;
      text-align: center;
      padding: 4px 0;
      outline: none;
    }

    body.embed {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    body.embed .controls-bar {
      display: none !important;
    }

    body.embed .stage-container {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>

  <script>
    'use strict';

    // -------------------------------------------------------------------------
    // PARAMS & SETTINGS
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const isEmbed = urlParams.has('embed') || window.location.hash.includes('embed');
    if (isEmbed) document.body.classList.add('embed');

    let choreTitle = urlParams.get('title') || 'Room Not Clean';
    let pointsLost = Math.abs(parseInt(urlParams.get('points'), 10) || 10);
    let soundEnabled = urlParams.get('sound') !== '0' && localStorage.getItem('nivas_celebration_sound') !== 'false';

    const pointsInput = document.getElementById('pointsInput');
    if (pointsInput) {
      pointsInput.value = pointsLost;
      pointsInput.addEventListener('change', (e) => {
        pointsLost = Math.max(1, Math.abs(parseInt(e.target.value, 10) || 10));
        updateBannerText();
      });
    }

    const soundBtn = document.getElementById('soundBtn');
    if (soundBtn) {
      soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        localStorage.setItem('nivas_celebration_sound', soundEnabled ? 'true' : 'false');
      });
    }

    // -------------------------------------------------------------------------
    // PROCEDURAL WEB AUDIO SYNTHESIZER
    // -------------------------------------------------------------------------
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && typeof window !== 'undefined') {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, type, start, dur, startGain = 0.2, endGain = 0.001) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(startGain, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(endGain, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }

    function playSlideWhistle(startFreq, endFreq, start, dur) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(startFreq, ctx.currentTime + start);
      osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + start + dur);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.24, ctx.currentTime + start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }

    function playWetSplat(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, ctx.currentTime + start);
      osc.frequency.exponentialRampToValueAtTime(38, ctx.currentTime + start + 0.22);
      gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 0.3);

      const pop = ctx.createOscillator();
      const popGain = ctx.createGain();
      pop.type = 'sine';
      pop.frequency.setValueAtTime(450, ctx.currentTime + start);
      pop.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + start + 0.14);
      popGain.gain.setValueAtTime(0.3, ctx.currentTime + start);
      popGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.18);
      pop.connect(popGain);
      popGain.connect(ctx.destination);
      pop.start(ctx.currentTime + start);
      pop.stop(ctx.currentTime + start + 0.2);
    }

    function playWahWahCrying(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [
        { f: 392, d: 0.35, bend: null },
        { f: 369, d: 0.35, bend: null },
        { f: 349, d: 0.38, bend: null },
        { f: 329, d: 1.6, bend: 261 },
      ];
      let offset = start;
      notes.forEach((n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(880, ctx.currentTime + offset);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(n.f, ctx.currentTime + offset);
        if (n.bend) {
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + offset + 0.35);
          osc.frequency.exponentialRampToValueAtTime(n.bend, ctx.currentTime + offset + n.d);
        }

        gain.gain.setValueAtTime(0, ctx.currentTime + offset);
        gain.gain.linearRampToValueAtTime(0.24, ctx.currentTime + offset + 0.04);
        gain.gain.setValueAtTime(0.22, ctx.currentTime + offset + n.d - 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + n.d);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + n.d + 0.05);

        offset += n.d + 0.08;
      });
    }

    function playGullFlightSounds(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      // Gentle distant gull call
      playSlideWhistle(1600, 2300, start + 0.2, 0.45);
      // Second cheeky gull chirp as it draws closer
      playTone(2600, 'triangle', start + 1.1, 0.18, 0.18);
      // Snatch whoosh & pop
      playSlideWhistle(1800, 950, start + 1.95, 0.2);
      playTone(650, 'sine', start + 2.05, 0.09, 0.35);
      // Caw as gull flies away
      playSlideWhistle(2200, 2900, start + 2.35, 0.5);
    }

    function playPenaltyGong(start) {
      if (!soundEnabled) return;

      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 2.0);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 2.1);
    }

    const tearStreams = document.getElementById('tearStreams');
    const streamLeft = document.getElementById('streamLeft');
    const streamLeftCore = document.getElementById('streamLeftCore');
    const streamRight = document.getElementById('streamRight');
    const streamRightCore = document.getElementById('streamRightCore');

    function updateBannerText() {
      bannerTitle.textContent = `Removed ${pointsLost} points from your account`;
    }
    updateBannerText();

    let startTime = null;
    let animFrame = null;
    let audioScheduled = false;

    // Tear particles
    const tearPool = [];
    for (let i = 0; i < 40; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '4');
      circle.setAttribute('fill', '#38bdf8');
      circle.setAttribute('opacity', '0');
      tearFountainLayer.appendChild(circle);
      tearPool.push({ el: circle, active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 });
    }

    // Splat droplets
    const dropletPool = [];
    for (let i = 0; i < 24; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', (Math.random() * 4 + 3).toString());
      circle.setAttribute('fill', Math.random() < 0.6 ? '#f43f5e' : (Math.random() < 0.5 ? '#10b981' : '#fde047'));
      circle.setAttribute('opacity', '0');
      splatDroplets.appendChild(circle);
      dropletPool.push({ el: circle, active: false, x: 0, y: 0, vx: 0, vy: 0 });
    }

    function triggerAudioTimeline() {
      if (audioScheduled) return;
      audioScheduled = true;
      playTone(523.25, 'sine', 0.2, 0.25, 0.18);
      playTone(659.25, 'sine', 0.55, 0.25, 0.18);
      playTone(783.99, 'sine', 0.9, 0.25, 0.18);
      playSlideWhistle(850, 240, 1.7, 0.45);
      setTimeout(() => playWetSplat(0), 2250);
      setTimeout(() => playWahWahCrying(0), 2600);
      setTimeout(() => playGullFlightSounds(0), 4000);
      setTimeout(() => playPenaltyGong(0), 7300);
    }

    function render(t) {
      // ---------------------------------------------------------
      // ACT 1: PURE BLISS (t: 0.0s to 1.8s)
      // ---------------------------------------------------------
      if (t < 1.8) {
        const bounce = Math.sin(t * 8) * 8;
        kidCharacter.setAttribute('transform', `translate(600, ${360 + bounce})`);
        kidStandingRig.setAttribute('opacity', '1');
        kidSlumpedRig.setAttribute('opacity', '0');
        kidHead.setAttribute('transform', `translate(0, ${Math.sin(t * 8) * 2}) rotate(${Math.sin(t * 4) * 4})`);

        faceHappy.setAttribute('opacity', '1');
        faceShocked.setAttribute('opacity', '0');
        faceCrying.setAttribute('opacity', '0');
        faceDumbfounded.setAttribute('opacity', '0');
        armsHappy.setAttribute('opacity', '1');
        armsDespair.setAttribute('opacity', '0');

        const tongueWiggle = Math.sin(t * 14) * 4;
        const lickingTongue = document.getElementById('lickingTongue');
        if (lickingTongue) lickingTongue.setAttribute('transform', `translate(${tongueWiggle}, 0)`);

        waffleConeGroup.setAttribute('transform', `translate(630, ${410 + bounce}) rotate(-8)`);
        waffleConeGroup.setAttribute('opacity', '1');
        scoopTower.setAttribute('transform', 'translate(0, 0)');
        scoopTower.setAttribute('opacity', '1');

        splatGroup.setAttribute('opacity', '0');
        personalCloud.setAttribute('opacity', '0');
        seagullBird.setAttribute('opacity', '0');
        penaltyBanner.setAttribute('opacity', '0');
        moodOverlay.setAttribute('opacity', '0');
        if (tearStreams) tearStreams.setAttribute('opacity', '0');
        birdGroundShadow.setAttribute('rx', '0');
      }

      // ---------------------------------------------------------
      // ACT 2: THE SLIP & CALAMITY (t: 1.8s to 2.3s)
      // ---------------------------------------------------------
      else if (t >= 1.8 && t < 2.3) {
        const dropT = t - 1.8; // 0 to 0.5s

        kidCharacter.setAttribute('transform', 'translate(600, 360)');
        kidStandingRig.setAttribute('opacity', '1');
        kidSlumpedRig.setAttribute('opacity', '0');
        kidHead.setAttribute('transform', 'translate(0, -4) scale(1.05)');

        faceHappy.setAttribute('opacity', '0');
        faceShocked.setAttribute('opacity', '1');
        faceCrying.setAttribute('opacity', '0');
        faceDumbfounded.setAttribute('opacity', '0');

        waffleConeGroup.setAttribute('transform', 'translate(635, 412) rotate(14)');
        waffleConeGroup.setAttribute('opacity', '1');
        scoopTower.setAttribute('opacity', '1');

        if (dropT < 0.12) {
          const wobble = Math.sin(dropT * 40) * 12;
          scoopTower.setAttribute('transform', `translate(${wobble}, ${dropT * 30}) rotate(${wobble * 1.5})`);
        } else {
          const fallTime = dropT - 0.12;
          const fallY = 0.5 * 2400 * fallTime * fallTime;
          const fallX = fallTime * 150;
          const fallRot = fallTime * 190;
          scoopTower.setAttribute('transform', `translate(${fallX}, ${fallY}) rotate(${fallRot})`);
        }

        splatGroup.setAttribute('opacity', '0');
        if (tearStreams) tearStreams.setAttribute('opacity', '0');
      }

      // ---------------------------------------------------------
      // ACT 3: SPLAT & WIDE-ARMED CRYING (t: 2.3s to 4.0s)
      // ---------------------------------------------------------
      else if (t >= 2.3 && t < 4.0) {
        const cryT = t - 2.3;

        scoopTower.setAttribute('opacity', '0');
        splatGroup.setAttribute('opacity', '1');

        if (cryT < 0.4) {
          const swScale = cryT / 0.4;
          splatShockwave.setAttribute('r', (swScale * 75).toString());
          splatShockwave.setAttribute('opacity', (1 - swScale).toString());
        } else {
          splatShockwave.setAttribute('opacity', '0');
        }

        const cryShake = Math.sin(t * 36) * 3;
        kidCharacter.setAttribute('transform', `translate(${600 + cryShake}, ${360 + Math.abs(cryShake)})`);
        kidStandingRig.setAttribute('opacity', '1');
        kidSlumpedRig.setAttribute('opacity', '0');

        faceHappy.setAttribute('opacity', '0');
        faceShocked.setAttribute('opacity', '0');
        faceCrying.setAttribute('opacity', '1');
        faceDumbfounded.setAttribute('opacity', '0');

        // SPREAD HANDS IN DESPAIR
        armsHappy.setAttribute('opacity', '0');
        armsDespair.setAttribute('opacity', '1');

        // Right hand holds empty waffle cone out to right at (745, 425)
        waffleConeGroup.setAttribute('transform', `translate(${745 + cryShake}, ${425 + cryShake}) rotate(-25)`);
        waffleConeGroup.setAttribute('opacity', '1');

        // Continuous pulsing cartoon tear streams
        if (tearStreams) {
          tearStreams.setAttribute('opacity', '1');
          const wave = Math.sin(t * 18) * 8;
          const dLeft = `M 576 350 Q ${510 + wave} 270 420 535`;
          const dRight = `M 624 350 Q ${690 - wave} 270 780 535`;
          if (streamLeft) streamLeft.setAttribute('d', dLeft);
          if (streamLeftCore) streamLeftCore.setAttribute('d', dLeft);
          if (streamRight) streamRight.setAttribute('d', dRight);
          if (streamRightCore) streamRightCore.setAttribute('d', dRight);
        }

        moodOverlay.setAttribute('opacity', (Math.min(0.4, cryT * 0.35)).toString());
        personalCloud.setAttribute('opacity', (Math.min(1, cryT * 2)).toString());
        personalCloud.setAttribute('transform', `translate(600, ${180 + Math.sin(t * 4) * 6})`);
      }

      // ---------------------------------------------------------
      // ACT 4: THE SLOW, MAJESTIC SEAGULL APPROACH & HEIST (t: 4.0s to 7.1s)
      // "make the bird come slowly and make it look more like a bird"
      // ---------------------------------------------------------
      else if (t >= 4.0 && t < 7.1) {
        const approachT = t - 4.0; // 0s to 3.1s
        seagullBird.setAttribute('opacity', '1');
        scoopTower.setAttribute('opacity', '0');
        splatGroup.setAttribute('opacity', '1');
        armsDespair.setAttribute('opacity', '1');
        armsHappy.setAttribute('opacity', '0');
        personalCloud.setAttribute('opacity', '0.85');

        let bx, by, bRot, bScale;

        // Stage 4A: Slow, deliberate, majestic glide across the sky (4.0s to 5.7s, 1.7s duration)
        if (approachT < 1.7) {
          const p = approachT / 1.7; // 0 to 1
          const easeP = p * p * (3 - 2 * p); // smoothstep

          // Graceful slow wing flaps
          const flap = Math.sin(approachT * 7) * 14;
          gullNearWing.setAttribute('transform', `translate(-5, -8) rotate(${flap})`);
          gullFarWing.setAttribute('transform', `translate(5, -12) rotate(${-flap * 0.75})`);
          gullFeet.setAttribute('transform', 'translate(14, 22)'); // feet tucked

          // Trajectory: High far right (1350, 70) down to (820, 240) in wide open space to right of kid
          bx = 1350 + (820 - 1350) * easeP;
          by = 70 + (240 - 70) * Math.pow(p, 1.25);
          bRot = -10 + Math.sin(p * Math.PI * 2) * 3;
          bScale = 0.45 + 0.45 * p; // smooth scale from distance

          // Kid continues wailing in despair
          const cryShake = Math.sin(t * 36) * 2.5;
          kidCharacter.setAttribute('transform', `translate(${600 + cryShake}, ${360 + Math.abs(cryShake)})`);
          kidStandingRig.setAttribute('opacity', '1');
          kidSlumpedRig.setAttribute('opacity', '0');

          waffleConeGroup.setAttribute('transform', `translate(${745 + cryShake}, ${425 + cryShake}) rotate(-25)`);
          waffleConeGroup.setAttribute('opacity', '1');
          stolenConeInBeak.setAttribute('opacity', '0');

          if (tearStreams) {
            tearStreams.setAttribute('opacity', '1');
            const wave = Math.sin(t * 18) * 8;
            const dLeft = `M 576 350 Q ${510 + wave} 270 420 535`;
            const dRight = `M 624 350 Q ${690 - wave} 270 780 535`;
            if (streamLeft) streamLeft.setAttribute('d', dLeft);
            if (streamLeftCore) streamLeftCore.setAttribute('d', dLeft);
            if (streamRight) streamRight.setAttribute('d', dRight);
            if (streamRightCore) streamRightCore.setAttribute('d', dRight);
          }

          birdGroundShadow.setAttribute('cx', bx.toString());
          birdGroundShadow.setAttribute('rx', (bScale * 45).toString());
          birdGroundShadow.setAttribute('ry', (bScale * 10).toString());
        }

        // Stage 4B: Hover right beside the hand, flare landing gear, and SNATCH! (5.7s to 6.2s, 0.5s duration)
        else if (approachT >= 1.7 && approachT < 2.2) {
          const hoverP = (approachT - 1.7) / 0.5; // 0 to 1

          // Hover flutter
          const flap = Math.sin(approachT * 24) * 16;
          gullNearWing.setAttribute('transform', `translate(-5, -8) rotate(${flap})`);
          gullFarWing.setAttribute('transform', `translate(5, -12) rotate(${-flap * 0.75})`);

          // Landing gear drops down forward!
          gullFeet.setAttribute('transform', `translate(14, 22) rotate(${-hoverP * 24})`);

          // Exact target: Hand is at (745, 425). Bird clamp point is at (bx - 73, by + 10)
          // Bird center descends directly onto target (820, 240) -> (818, 415)!
          bx = 820 + (818 - 820) * hoverP;
          by = 240 + (415 - 240) * Math.pow(hoverP, 1.2);
          bRot = -10 - hoverP * 4;
          bScale = 0.9 + 0.1 * hoverP;

          if (hoverP < 0.85) {
            // Still in hand
            waffleConeGroup.setAttribute('opacity', '1');
            stolenConeInBeak.setAttribute('opacity', '0');
            if (tearStreams) tearStreams.setAttribute('opacity', '1');
          } else {
            // *YOINK!* Cone snatches cleanly into seagull's beak!
            waffleConeGroup.setAttribute('opacity', '0');
            stolenConeInBeak.setAttribute('opacity', '1');
            fingerRight1.setAttribute('opacity', '1');
            fingerRight2.setAttribute('opacity', '1');
            fingerRight3.setAttribute('opacity', '1');

            // Kid immediately stops crying in sheer disbelief!
            if (tearStreams) tearStreams.setAttribute('opacity', '0');
            faceHappy.setAttribute('opacity', '0');
            faceShocked.setAttribute('opacity', '0');
            faceCrying.setAttribute('opacity', '0');
            faceDumbfounded.setAttribute('opacity', '1');
            kidHead.setAttribute('transform', 'translate(0, -2) rotate(8)');
          }

          birdGroundShadow.setAttribute('cx', bx.toString());
          birdGroundShadow.setAttribute('rx', '46');
          birdGroundShadow.setAttribute('ry', '12');
        }

        // Stage 4C: Triumphant climb away into distance carrying cone! (6.2s to 7.1s, 0.9s duration)
        else {
          const climbP = (approachT - 2.2) / 0.9; // 0 to 1

          // Powerful climb strokes
          const flap = Math.sin(approachT * 15) * 28;
          gullNearWing.setAttribute('transform', `translate(-5, -8) rotate(${flap})`);
          gullFarWing.setAttribute('transform', `translate(5, -12) rotate(${-flap * 0.75})`);
          gullFeet.setAttribute('transform', 'translate(14, 22)'); // feet tucked back

          // Climbs from (818, 415) up across the sky to (-170, 30)
          bx = 818 + (-170 - 818) * climbP;
          by = 415 + (30 - 415) * Math.pow(climbP, 0.8) - Math.sin(climbP * Math.PI) * 45;
          bRot = 14 - climbP * 10;
          bScale = 1.0 - climbP * 0.25;

          waffleConeGroup.setAttribute('opacity', '0');
          stolenConeInBeak.setAttribute('opacity', '1');

          if (tearStreams) tearStreams.setAttribute('opacity', '0');
          faceDumbfounded.setAttribute('opacity', '1');
          faceCrying.setAttribute('opacity', '0');

          // Kid's head & eyes track the bird flying from right to left across the sky!
          const headRot = 8 - climbP * 18;
          kidHead.setAttribute('transform', `translate(0, -2) rotate(${headRot})`);
          if (pupilLeft) pupilLeft.setAttribute('cx', (-24 - climbP * 8).toString());
          if (pupilRight) pupilRight.setAttribute('cx', (24 - climbP * 8).toString());

          birdGroundShadow.setAttribute('cx', bx.toString());
          birdGroundShadow.setAttribute('rx', (bScale * 38).toString());
        }

        seagullBird.setAttribute('transform', `translate(${bx}, ${by}) rotate(${bRot}) scale(${bScale})`);
      }

      // ---------------------------------------------------------
      // ACT 5 & 6: TOTAL DEFEAT & PENALTY BANNER (t: 7.1s to 9.8s)
      // ---------------------------------------------------------
      else if (t >= 7.1) {
        const endT = t - 7.1;
        seagullBird.setAttribute('opacity', '0');
        birdGroundShadow.setAttribute('rx', '0');
        waffleConeGroup.setAttribute('opacity', '0');
        splatGroup.setAttribute('opacity', '1');
        if (tearStreams) tearStreams.setAttribute('opacity', '0');

        // Kid slumps down onto knees facing forward in complete, heartbreaking defeat
        kidStandingRig.setAttribute('opacity', '0');
        kidSlumpedRig.setAttribute('opacity', '1');
        kidCharacter.setAttribute('transform', 'translate(600, 385)');

        personalCloud.setAttribute('opacity', '0.9');

        // GAME-SHOW PENALTY BANNER DROPS WITH ELASTIC SPRING!
        penaltyBanner.setAttribute('opacity', '1');
        const springT = Math.min(1, endT / 0.65);
        const springY = -180 + (220 - (-180)) * (1 - Math.cos(springT * Math.PI * 0.5) * Math.cos(springT * Math.PI * 2.5) * Math.exp(-springT * 3.2));
        const finalY = springT >= 0.92 ? 220 : springY;
        penaltyBanner.setAttribute('transform', `translate(600, ${finalY})`);
      }
    }

    function renderTears() {
      tearPool.forEach((p, idx) => {
        if (!p.active && Math.random() < 0.28) {
          p.active = true;
          const isLeft = idx % 2 === 0;
          p.x = isLeft ? 576 : 624;
          p.y = 350;
          p.vx = isLeft ? -(Math.random() * 160 + 120) : (Math.random() * 160 + 120);
          p.vy = -(Math.random() * 220 + 180);
          p.life = 1.0;
        }
        if (p.active) {
          p.x += p.vx * 0.016;
          p.y += p.vy * 0.016;
          p.vy += 950 * 0.016;
          p.life -= 0.018;
          if (p.y > 540 || p.life <= 0) {
            p.active = false;
            p.el.setAttribute('opacity', '0');
          } else {
            p.el.setAttribute('cx', p.x.toString());
            p.el.setAttribute('cy', p.y.toString());
            p.el.setAttribute('opacity', p.life.toString());
          }
        }
      });
    }

    // ---------------------------------------------------------
    // ANIMATION LOOP RUNNER
    // ---------------------------------------------------------
    function tick(now) {
      if (!startTime) startTime = now;
      const elapsed = (now - startTime) / 1000;

      if (elapsed > 0.05 && !audioScheduled) {
        triggerAudioTimeline();
      }

      if (elapsed <= DURATION) {
        render(elapsed);
        animFrame = requestAnimationFrame(tick);
      } else {
        render(DURATION);
      }
    }

    function startAnimation() {
      if (animFrame) cancelAnimationFrame(animFrame);
      startTime = null;
      audioScheduled = false;
      tearPool.forEach(p => { p.active = false; p.el.setAttribute('opacity', '0'); });
      dropletPool.forEach(d => { d.active = false; d.el.setAttribute('opacity', '0'); });
      render(0);
      animFrame = requestAnimationFrame(tick);
    }

    window.render = render;
    window.stopAnimation = () => {
      if (animFrame) cancelAnimationFrame(animFrame);
      animFrame = null;
    };
    window.startAnimation = startAnimation;

    window.addEventListener('load', () => {
      startAnimation();
    });

    const replayBtn = document.getElementById('replayBtn');
    if (replayBtn) {
      replayBtn.addEventListener('click', () => {
        startAnimation();
      });
    }

    if (!isEmbed) {
      scene.addEventListener('click', () => {
        startAnimation();
      });
    }
  </script>
</body>
</html>
