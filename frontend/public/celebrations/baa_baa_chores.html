</style></head><body><main><header><div><div class="eyebrow">A little celebration · No. 11</div><h1>Baa-Baa Chores</h1></div><div class="badge">A woolly wonderful celebration ✧</div></header><div class="stage"><svg id="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="scene-title scene-desc"></svg></div><footer><p>Little hops. Big smiles. Ewe did it.</p><div class="buttons"><button id="pause" aria-label="Pause animation">Pause</button><button id="replay" class="primary">↻ Replay</button></div></footer><p id="announcement" class="sr" role="status" aria-live="polite"></p></main><script>
'use strict';
const clamp=x=>Math.max(0,Math.min(1,x)),phase=(t,a,b)=>clamp((t-a)/(b-a)),ease=x=>1-Math.pow(1-clamp(x),3),mix=(a,b,p)=>a+(b-a)*p;

const check=(x,y,s=1,color='#fff')=>`<path d="M ${x-10*s} ${y} l ${7*s} ${8*s} l ${15*s} ${-19*s}" fill="none" stroke="${color}" stroke-width="${5*s}" stroke-linecap="round" stroke-linejoin="round"/>`;

function sheepArt(small=false){return `<g class="${small?'lamb-body':'sheep-body'}"><path d="M-34 37 V78 M-10 39 V80 M26 39 V79 M47 35 V75" stroke="#a3978c" stroke-width="13" stroke-linecap="round"/><path d="M-40 81 H-26 M-17 83 H-3 M20 82 H33 M41 78 H54" stroke="#756c75" stroke-width="10" stroke-linecap="round"/><g fill="#fff5e5" stroke="#ded5c1" stroke-width="2"><ellipse cy="7" rx="66" ry="48"/>${Array.from({length:10},(_,i)=>`<circle cx="${Math.cos(i/10*Math.PI*2)*55}" cy="${7+Math.sin(i/10*Math.PI*2)*35}" r="22"/>`).join('')}</g><ellipse cx="59" cy="-9" rx="27" ry="34" fill="#c8b8a6" stroke="#ad9e95" stroke-width="2"/><ellipse cx="36" cy="-36" rx="19" ry="10" transform="rotate(30 36 -36)" fill="#c8b8a6"/><ellipse cx="83" cy="-33" rx="17" ry="9" transform="rotate(-25 83 -33)" fill="#c8b8a6"/><g fill="#fff6e6"><circle cx="43" cy="-40" r="15"/><circle cx="61" cy="-45" r="17"/><circle cx="78" cy="-39" r="14"/></g><circle cx="50" cy="-12" r="3.5" fill="#645965"/><circle cx="70" cy="-12" r="3.5" fill="#645965"/><ellipse cx="60" cy="1" rx="5" ry="3" fill="#978085"/><path d="M52 11 Q60 19 69 10" fill="none" stroke="#917982" stroke-width="2" stroke-linecap="round"/><ellipse cx="42" cy="-1" rx="7" ry="4" fill="#deb5b3"/><ellipse cx="79" cy="-1" rx="7" ry="4" fill="#deb5b3"/><path d="M43 31 Q63 39 81 27" fill="none" stroke="#d69eb3" stroke-width="6"/><path d="M57 35 L53 47 Q62 55 71 47 L67 35Z" fill="#e9c480" stroke="#c3a06c" stroke-width="2"/><circle cx="62" cy="48" r="2" fill="#a68961"/><g fill="#e2afc4" stroke="#be8eaa" stroke-width="2"><path d="M49 -49 Q22 -72 23 -43 L49 -42 Q70 -70 75 -43 L50 -41Z"/><circle cx="49" cy="-46" r="6"/></g></g>`}
const scenes={
'baa-baa-chores':{
 duration:7.6,
 description:'Baa-baa-chores! Ewe did it! A cheerful sheep bounces through a pastel meadow, sorting abstract shapes. A fluffy spin sweeps the last tile into a completed checklist. The sheep steadies itself, then dances with two lambs as flowers bloom.',
 mount(svg){svg.innerHTML=`<title id="scene-title">Baa-Baa Chores</title><desc id="scene-desc">${this.description}</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8dfe8"/><stop offset="1" stop-color="#f9e8d5"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#c1d0ab"/><stop offset="1" stop-color="#8fae91"/></linearGradient><g id="heart"><path d="M0 9 C-27 -8 -16 -26 0 -13 C16 -26 27 -8 0 9Z" fill="#f7d9dd"/></g><g id="flower-art"><path d="M0 0 V31 M0 20 Q-22 2 -18 22 Q-7 30 0 26 M0 25 Q21 8 18 28 Q7 34 0 31" fill="#86a180"/><g fill="#e9bbcb">${Array.from({length:5},(_,i)=>`<ellipse cy="-11" rx="9" ry="13" transform="rotate(${i*72})"/>`).join('')}</g><circle r="7" fill="#f4d897"/></g><g id="cloud"><ellipse rx="115" ry="39" fill="#fff8ec"/><circle cx="-65" cy="-22" r="39" fill="#fff8ec"/><circle cx="0" cy="-43" r="57" fill="#fff8ec"/><circle cx="68" cy="-20" r="44" fill="#fff8ec"/></g></defs>
<rect width="1200" height="675" fill="url(#sky)"/><circle cx="988" cy="118" r="58" fill="#fff6d6"/><g fill="#fff6ed" opacity=".75"><path d="M179 126 C66 69 118 9 179 60 C240 9 292 69 179 126Z"/><path d="M699 136 C630 99 657 60 699 89 C741 60 768 99 699 136Z"/></g>
<path d="M0 393 Q175 286 356 389 T729 388 T1200 356 V675 H0Z" fill="#d1d9b7"/><path d="M0 479 Q280 371 557 459 T1200 422 V675 H0Z" fill="url(#hill)"/><path d="M0 597 Q255 518 551 577 T1200 549 V675 H0Z" fill="#a2bb98"/>
<g id="flowers">${Array.from({length:22},(_,i)=>`<g data-flower="${i}"><use href="#flower-art"/></g>`).join('')}</g>
<g id="sign" transform="translate(850 334)"><path d="M-112 -36 V161 M112 -36 V161" stroke="#b29677" stroke-width="16" stroke-linecap="round"/><path d="M-137 -55 H137" stroke="#bca080" stroke-width="18" stroke-linecap="round"/>${[0,1,2,3].map(i=>`<g transform="translate(${-90+i*60} 0)"><path d="M0 -51 V-22" stroke="#d5c19e" stroke-width="3"/><rect x="-24" y="-24" width="48" height="54" rx="15" fill="#fff2de" stroke="#ded1b9" stroke-width="3"/>${i<3?check(0,0,1,'#8a9e80'):'<rect id="empty-box" x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#b99aaa" stroke-width="3"/><g id="last-check">'+check(0,0,1,'#8a9e80')+'</g>'}</g>`).join('')}</g>
<g id="piles">${Array.from({length:12},(_,i)=>`<g data-shape="${i}">${i%3===0?'<circle r="13" fill="#c1b3d1" stroke="#e4d8e4" stroke-width="2"/>':i%3===1?star(0,0,1,'#e4c68e'):'<rect x="-12" y="-12" width="24" height="24" rx="5" fill="#acc5bd" stroke="#d6e1ca" stroke-width="2"/>'}</g>`).join('')}</g>
<g id="stray"><rect x="-19" y="-19" width="38" height="38" rx="9" fill="#f2dfc8" stroke="#c8acba" stroke-width="3"/><rect x="-8" y="-8" width="16" height="16" rx="3" fill="none" stroke="#a58b9e" stroke-width="3"/></g>
<g id="stage"><ellipse cx="608" cy="526" rx="182" ry="25" fill="#bd97a5"/><path d="M426 502 H790 V526 Q608 560 426 526Z" fill="#ba92a2"/><ellipse cx="608" cy="502" rx="182" ry="25" fill="#e5c6cd" stroke="#cba9b2" stroke-width="3"/></g>
<g id="puffs">${Array.from({length:9},(_,i)=>`<g data-puff="${i}"><use href="#heart"/></g>`).join('')}</g>
<g id="sheep">${sheepArt()}</g>
<g id="wool-ball"><g fill="#fff5e6" stroke="#e5d9c5" stroke-width="2"><circle r="86"/>${Array.from({length:12},(_,i)=>`<circle cx="${Math.cos(i/12*Math.PI*2)*75}" cy="${Math.sin(i/12*Math.PI*2)*75}" r="28"/>`).join('')}</g><path d="M-33 -13 Q0 -45 33 -13 Q55 11 21 34 Q-2 48 -27 22" fill="none" stroke="#e9dfca" stroke-width="5" stroke-linecap="round"/></g>
<g id="dizzy">${[0,1,2].map(i=>`<g data-dizzy="${i}">${star(0,0,.45,'#f3db9f')}</g>`).join('')}</g>
<g id="lambs"><g id="lamb-left">${sheepArt(true)}</g><g id="lamb-right">${sheepArt(true)}</g></g>
<g id="petals">${Array.from({length:24},(_,i)=>`<ellipse data-petal="${i}" rx="6" ry="10" fill="${['#f0c6d3','#d4c5dc','#f5ddb4'][i%3]}"/>`).join('')}</g>
<g id="message"><path d="M254 112 L207 91 L218 138 L207 175 L264 165 M946 112 L993 91 L982 138 L993 175 L936 165" fill="#b99ab5"/><path d="M251 90 Q600 57 949 90 V169 Q600 137 251 169Z" fill="#fff0d7" stroke="#d7b6be" stroke-width="3"/><text x="600" y="138" text-anchor="middle" fill="#876777" font-family="ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif" font-size="48" font-weight="900" letter-spacing="-1">BAA-BAA-CHORES!</text><text x="600" y="217" text-anchor="middle" fill="#607859" font-family="ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif" font-size="45" font-weight="900">EWE DID IT!</text><text id="child-label" x="600" y="250" text-anchor="middle" fill="#607859" font-family="system-ui,sans-serif" font-size="19" font-weight="700"></text></g>
<g id="wipe"><use href="#cloud"/></g>`;
 const nodes={};svg.querySelectorAll('[id]').forEach(n=>nodes[n.id]=n);return nodes;},
 render(n,t,svg){const show=(id,v)=>n[id].setAttribute('opacity',v),tr=(id,v)=>n[id].setAttribute('transform',v);
 const done=t>=4.55;show('last-check',done?1:0);show('empty-box',done?0:1);
 let x=240,y=433,rot=0;
 if(t<1.1){x=mix(182,240,ease(phase(t,0,.8)));y-=Math.abs(Math.sin(t*10))*4;}
 else if(t<3.8){let p=phase(t,1.1,3.8),b=p*3;x=mix(240,659,p);y=433-Math.abs(Math.sin(b*Math.PI))*95;rot=Math.sin(b*Math.PI*2)*8;}
 else if(t<4.55){let p=phase(t,3.8,4.55);x=mix(659,684,p);y=433;rot=p*720;}
 else if(t<5.2){x=684;y=433;rot=Math.sin(phase(t,4.55,5.2)*Math.PI*3)*9*(1-phase(t,4.55,5.2));}
 else{let p=ease(phase(t,5.2,5.5));x=mix(684,591,p)+Math.sin((t-5.5)*10)*7*p;y=mix(433,416,p)-Math.abs(Math.sin((t-5.5)*10))*8*p;rot=Math.sin((t-5.5)*10)*4*p;}
 tr('sheep',`translate(${x} ${y}) rotate(${rot})`);show('sheep',t>=3.95&&t<4.45?0:1);
 let wool=t>=3.8&&t<4.55?Math.sin(phase(t,3.8,4.55)*Math.PI):0;show('wool-ball',wool);tr('wool-ball',`translate(${x} ${y}) rotate(${rot}) scale(${.5+wool*.5})`);
 svg.querySelectorAll('[data-shape]').forEach((a,i)=>{let group=Math.floor(i/4),p=ease(phase(t,1.95+group*.9,2.2+group*.9));let sx=333+group*143+(i%4-1.5)*19,sy=502-(i%4%2)*20,ex=306+group*152+(i%4)*22,ey=529;a.setAttribute('transform',`translate(${mix(sx,ex,p)} ${mix(sy,ey,p)}) rotate(${(1-p)*(i*29)}) scale(.8)`);});
 let sp=ease(phase(t,3.9,4.55));show('stray',1-phase(t,4.5,4.6));tr('stray',`translate(${mix(735,940,sp)} ${mix(492,334,sp)-Math.sin(sp*Math.PI)*80}) rotate(${sp*360})`);
 svg.querySelectorAll('[data-puff]').forEach((a,i)=>{let g=Math.floor(i/3),p=phase(t,1.92+g*.9,2.4+g*.9);a.setAttribute('opacity',Math.sin(p*Math.PI)*.9);a.setAttribute('transform',`translate(${379+g*140+(i%3-1)*p*43} ${502-p*65}) scale(${.4+p*.4})`);});
 show('dizzy',t>4.55&&t<5.2?1:0);svg.querySelectorAll('[data-dizzy]').forEach((a,i)=>a.setAttribute('transform',`translate(${735+Math.cos(t*8+i*2)*36} ${358+Math.sin(t*8+i*2)*9})`));
 let party=ease(phase(t,5.2,5.5));show('stage',party);tr('stage',`translate(0 ${28*(1-party)})`);show('lambs',party);tr('lamb-left',`translate(${mix(247,371,party)} ${490-Math.abs(Math.sin(t*10))*8}) scale(.62)`);tr('lamb-right',`translate(${mix(980,873,party)} ${490-Math.abs(Math.sin(t*10+1))*8}) scale(-.62 .62)`);
 svg.querySelectorAll('[data-flower]').forEach((a,i)=>{let p=ease(phase(t,5.2+i*.015,5.6+i*.015));a.setAttribute('transform',`translate(${85+i*49} ${558+i%3*29}) scale(${(.45+i%3*.13)*(.1+p*.9)})`);});
 show('message',phase(t,5.25,5.5));tr('message',`translate(0 ${-20*(1-party)})`);
 svg.querySelectorAll('[data-petal]').forEach((a,i)=>{let p=phase(t,5.4+i%4*.04,7);a.setAttribute('opacity',Math.sin(p*Math.PI)*.85);a.setAttribute('transform',`translate(${183+(i*127)%840} ${275+i%4*28+p*157}) rotate(${p*190+i*17})`);});
 let wipe=ease(phase(t,7,7.6));show('wipe',wipe?1:0);tr('wipe',`translate(${mix(-1300,600,wipe)} 400) scale(9)`);
 }
}};
class CelebrationPlayer{
 constructor(svg,{sceneId='baa-baa-chores',colorVariation='strawberry',childName='',loop=true,onStateChange=()=>{}}={}){
 if(!scenes[sceneId])throw new Error('Unknown celebration scene');
 this.svg=svg;this.scene=scenes[sceneId];this.loop=loop;this.onStateChange=onStateChange;this.time=0;this.running=false;this.destroyed=false;this.visible=true;this.frame=0;this.last=null;this.announced=false;
 const p=palettes[colorVariation]||palettes.strawberry;Object.entries(p).forEach(([k,v])=>svg.style.setProperty('--'+k,v));this.nodes=this.scene.mount(svg);this.nodes['child-label'].textContent=childName?`Well done, ${String(childName).slice(0,32)}!`:'';
 this.motion=matchMedia('(prefers-reduced-motion: reduce)');
 this.tick=now=>{this.frame=0;if(!this.canRun()){this.last=null;return}if(this.last!==null)this.time+=(now-this.last)/1000;this.last=now;if(this.time>=this.scene.duration){if(this.loop){this.time%=this.scene.duration;this.announced=false}else{this.time=6.6;this.running=false;this.onStateChange(false)}}this.render();this.schedule();};
 this.onVisibility=()=>{this.cancel();this.schedule()};this.onMotion=()=>{this.cancel();if(this.motion.matches){this.time=6.4;this.render()}else if(this.running){this.time=0;this.render();this.schedule()}this.onStateChange(this.running&&!this.motion.matches)};
 document.addEventListener('visibilitychange',this.onVisibility);this.motion.addEventListener('change',this.onMotion);
 this.observer=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;this.cancel();this.schedule()});this.observer.observe(svg);
 this.onPageHide=()=>this.destroy();window.addEventListener('pagehide',this.onPageHide,{once:true});this.render();this.play();
 }
 canRun(){return this.running&&!this.destroyed&&this.visible&&!document.hidden&&!this.motion.matches}
 schedule(){if(this.canRun()&&!this.frame)this.frame=requestAnimationFrame(this.tick)}
 cancel(){cancelAnimationFrame(this.frame);this.frame=0;this.last=null}
 render(){this.scene.render(this.nodes,this.time,this.svg);if(this.time>=5.6&&!this.announced){document.getElementById('announcement').textContent=this.scene.description;this.announced=true}}
 play(){if(this.destroyed)return;this.running=true;if(this.motion.matches){this.time=6.4;this.render()}this.onStateChange(!this.motion.matches);this.schedule()}
 pause(){if(this.destroyed)return;this.running=false;this.cancel();this.onStateChange(false)}
 replay(){if(this.destroyed)return;this.cancel();this.time=this.motion.matches?6.4:0;this.announced=false;this.render();this.play()}
 destroy(){if(this.destroyed)return;this.pause();this.destroyed=true;this.observer.disconnect();document.removeEventListener('visibilitychange',this.onVisibility);this.motion.removeEventListener('change',this.onMotion);window.removeEventListener('pagehide',this.onPageHide);this.onDestroy?.()}
}
window.CelebrationPlayer=CelebrationPlayer;window.celebrationScenes=scenes;
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
const pauseButton=document.getElementById('pause');
const player=new CelebrationPlayer(document.getElementById('scene'),{onStateChange:playing=>{pauseButton.textContent=playing?'Pause':'Play';pauseButton.setAttribute('aria-label',playing?'Pause animation':'Play animation')}});
window.sheepPlayer=player;
const toggle=()=>player.running&&!player.motion.matches?player.pause():player.play();const replay=()=>player.replay();
pauseButton.addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',replay);player.onDestroy=()=>{pauseButton.removeEventListener('click',toggle);document.getElementById('replay').removeEventListener('click',replay)};
</script></body></html>
