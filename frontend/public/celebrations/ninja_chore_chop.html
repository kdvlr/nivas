const scenes={'ninja-chore-chop':{duration:8,finalTime:6.6,description:'Hi-yah! Chores complete! A friendly ninja somersaults into a moonlit dojo, chops a symbol checklist three times, and turns the pieces into a giant glowing checkmark. The ninja lands in a proud pose before a smoke-cloud reset.',mount(svg){svg.innerHTML=`<title id="title">Ninja Chore Chop</title><desc id="description">${this.description}</desc><defs><linearGradient id="room" x2="0" y2="1"><stop stop-color="#292740"/><stop offset="1" stop-color="#635879"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffe2ad" stop-opacity=".6"/><stop offset="1" stop-color="#ffe2ad" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="675" fill="url(#room)"/><path d="M0 490 H1200 V675 H0Z" fill="#857a91"/><path d="M0 490 H1200 M0 571 H1200 M0 649 H1200 M100 675 L270 490 M450 675 L500 490 M750 675 L700 490 M1100 675 L930 490" stroke="#b3a6b5" stroke-width="3" opacity=".3" fill="none"/>

<g stroke="#aaa0b7" fill="none" stroke-width="4" opacity=".25"><rect x="35" y="291" width="212" height="153" rx="10"/><rect x="953" y="291" width="212" height="153" rx="10"/><path d="M106 292 V443 M177 292 V443 M1024 292 V443 M1095 292 V443 M35 367 H247 M953 367 H1165"/></g>

${Array.from({length:22},(_,i)=>`<g id="star${i}">${star(0,0,.3+i%3*.2,['#d1eee1','#ecd8ae','#c8b4dc'][i%3])}</g>`).join('')}
<g fill="#d8cfe3">${[0,1].map(i=>`<g id="puff${i}"><circle r="34"/><circle cx="-25" cy="7" r="23"/><circle cx="24" cy="9" r="23"/>${star(0,-5,1.8,'#fff0bd')}</g>`).join('')}</g>
<g id="message"><text x="600" y="107" text-anchor="middle" fill="#f5dba7" font-family="ui-rounded,system-ui,sans-serif" font-weight="900" font-size="59" letter-spacing="3">HI-YAH!</text><rect x="291" y="123" width="618" height="66" rx="24" fill="#eee6d8"/><text x="600" y="169" text-anchor="middle" fill="#5c5677" font-family="ui-rounded,system-ui,sans-serif" font-weight="900" font-size="38" letter-spacing="1">CHORES COMPLETE!</text></g>
<g id="wipe" fill="#e5ddea">${Array.from({length:9},(_,i)=>`<circle cx="${600+Math.cos(i*6.283/9)*110}" cy="${337+Math.sin(i*6.283/9)*80}" r="130"/>`).join('')}</g>`;return Object.fromEntries([...svg.querySelectorAll('[id]')].map(n=>[n.id,n]))},
render(n,t){const show=(id,v)=>n[id].setAttribute('opacity',v),tr=(id,v)=>n[id].setAttribute('transform',v);const arrive=ease(phase(t,.7,1.8));let x=mix(-140,388,arrive),y=416-Math.sin(phase(t,.7,1.8)*Math.PI)*105,rot=t<1.8?phase(t,.7,1.8)*360:0;if(t>=4.65&&t<5.45){let p=phase(t,4.65,5.45);x=mix(388,413,p);y=416-Math.sin(p*Math.PI)*105}if(t>=5.45){x=413;y=416+Math.sin(phase(t,5.45,5.8)*Math.PI)*13}tr('ninja',`translate(${x} ${y}) rotate(${rot})`);n.shadow.setAttribute('cx',x);n.shadow.setAttribute('rx',Math.max(38,86-(416-y)*.25));tr('scarf',`rotate(${Math.sin(t*7)*8} -26 -73)`);tr('head',`rotate(${ease(phase(t,6.8,7.05))*10} 0 0)`);
let arm=0;for(let i=0;i<3;i++){let p=phase(t,2+i*.52,2.5+i*.52);if(p>0&&p<1)arm=-28*Math.sin(p*Math.PI*2)+130*ease(phase(p,.3,.75));let s=phase(t,2.16+i*.52,2.53+i*.52);show('slash'+i,s>0&&s<1?Math.sin(s*Math.PI):0);n['slash'+i].setAttribute('stroke-dasharray',`${ease(s)*430} 500`)}if(t>=3.55)arm=mix(110,30,ease(phase(t,3.55,4.1)));if(t>=5.45)arm=mix(30,115,ease(phase(t,5.45,5.8)));tr('sword-arm',`rotate(${arm} 38 25)`);show('sword',1-phase(t,5.5,5.85));n['left-arm'].setAttribute('d',t>5.7?'M-39 25 Q-75 9 -68 -20':'M-39 25 Q-72 42 -64 66');show('scroll',1-phase(t,3.5,3.65));tr('scroll',`translate(${t<.7?Math.sin(t*23)*2:0} ${-240*(1-ease(phase(t,0,.65)))})`);
for(let i=0;i<4;i++){let burst=ease(phase(t,3.55,4)),fold=ease(phase(t,4,4.8)),px=[620,770,620,770][i]+(i%2?1:-1)*90*burst,py=[326,326,437,437][i]+(i<2?-1:1)*62*burst;tr('piece'+i,`translate(${mix(px,[630,666,728,783][i],fold)} ${mix(py,[362,393,346,278][i],fold)}) rotate(${(i%2?1:-1)*burst*30*(1-fold)}) scale(${1-fold*.5})`);show('piece'+i,t>=3.55?1-phase(t,4.65,4.95):0)}show('victory',ease(phase(t,4.65,5.1)));show('message',phase(t,5.4,5.65));tr('message',`translate(0 ${-24*(1-ease(phase(t,5.4,5.8)))})`);for(let i=0;i<2;i++){let p=phase(t,5.45,6.15);show('puff'+i,Math.sin(p*Math.PI)*.8);tr('puff'+i,`translate(${i?882:232} ${500-p*35}) scale(${.4+p})`)}for(let i=0;i<22;i++){let p=phase(t,5.45+i%4*.05,7.2);show('star'+i,Math.sin(p*Math.PI)*.85);tr('star'+i,`translate(${i%2?906+i%5*26:146+i%5*24} ${244+p*278}) rotate(${i*15+p*90})`)}let wipe=ease(phase(t,7.2,8));show('wipe',wipe?1:0);tr('wipe',`translate(${600*(1-wipe*4)} ${337*(1-wipe*4)}) scale(${wipe*4})`)
}}};
class CelebrationPlayer {
constructor(svg,{sceneId='ninja-chore-chop',loop=true}={}){this.svg=svg;this.scene=scenes[sceneId];this.nodes=this.scene.mount(svg);this.time=0;this.loop=loop;this.running=false;this.destroyed=false;this.visible=true;this.frame=0;this.last=null;this.motion=matchMedia('(prefers-reduced-motion: reduce)');this.tick=now=>{this.frame=0;if(!this.canRun())return;if(this.last!==null)this.time+=(now-this.last)/1000;this.last=now;if(this.time>=this.scene.duration){if(this.loop){this.time%=this.scene.duration;this.announced=false}else{this.time=this.scene.finalTime;this.pause()}}this.render();this.schedule()};this.onVisibility=()=>{this.cancel();this.schedule()};this.onMotion=()=>{this.cancel();this.time=this.motion.matches?this.scene.finalTime:0;this.render();this.update();this.schedule()};document.addEventListener('visibilitychange',this.onVisibility);this.motion.addEventListener('change',this.onMotion);this.observer=new IntersectionObserver(es=>{this.visible=es[0].isIntersecting;this.cancel();this.schedule()});this.observer.observe(svg);this.play()}
canRun(){return this.running&&!this.destroyed&&this.visible&&!document.hidden&&!this.motion.matches}schedule(){if(this.canRun()&&!this.frame)this.frame=requestAnimationFrame(this.tick)}cancel(){cancelAnimationFrame(this.frame);this.frame=0;this.last=null}render(){this.scene.render(this.nodes,this.time);if(this.time>=5.8&&!this.announced){document.getElementById('announcement').textContent=this.scene.description;this.announced=true}}update(){document.getElementById('pause').textContent=this.running&&!this.motion.matches?'Pause':'Play'}play(){if(this.destroyed)return;this.running=true;if(this.motion.matches)this.time=this.scene.finalTime;this.render();this.update();this.schedule()}pause(){this.running=false;this.cancel();this.update()}replay(){if(this.destroyed)return;this.cancel();this.time=this.motion.matches?this.scene.finalTime:0;this.announced=false;this.play()}destroy(){if(this.destroyed)return;this.pause();this.destroyed=true;this.observer.disconnect();document.removeEventListener('visibilitychange',this.onVisibility);this.motion.removeEventListener('change',this.onMotion);this.onDestroy?.()}}
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');const player=new CelebrationPlayer(document.getElementById('scene'));window.ninjaPlayer=player;window.CelebrationPlayer=CelebrationPlayer;window.celebrationScenes=scenes;const toggle=()=>player.running&&!player.motion.matches?player.pause():player.play(),replay=()=>player.replay(),cleanup=()=>player.destroy();document.getElementById('pause').addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',replay);window.addEventListener('pagehide',cleanup);player.onDestroy=()=>{document.getElementById('pause').removeEventListener('click',toggle);document.getElementById('replay').removeEventListener('click',replay);window.removeEventListener('pagehide',cleanup)};
</script></body></html>
