  <script>
    'use strict';

    // -------------------------------------------------------------------------
    // PARAMS & POINTS CONFIGURATION
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const pointsLost = Math.abs(parseInt(urlParams.get('points'), 10) || 10);
    const soundEnabled = urlParams.get('sound') !== '0' && localStorage.getItem('nivas_celebration_sound') !== 'false';

    document.getElementById('bannerText').textContent = `Removed ${pointsLost} points from your account`;

    const TOTAL_DURATION = 12.0;

    // -------------------------------------------------------------------------
    // MATH & EASING
    // -------------------------------------------------------------------------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const easeInQuad = (x) => x * x;
    const easeOutBack = (x) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };
    const DEG = Math.PI / 180;

    // -------------------------------------------------------------------------
    // PROCEDURAL WEB AUDIO
    // -------------------------------------------------------------------------
    class CartoonSFX {
      constructor() {
        this.ctx = null;
        this.enabled = soundEnabled;
        this.triggered = new Set();
      }
      init() {
        if (!this.enabled) return;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      }
      resetTriggers() { this.triggered.clear(); }
      triggerOnce(id, fn) {
        if (this.triggered.has(id)) return;
        this.triggered.add(id);
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try { fn(this.ctx); } catch (e) {}
      }
      tone(ctx, freq, start, dur, type = 'sine', vol = 0.15, bendTo = null) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        if (bendTo) osc.frequency.exponentialRampToValueAtTime(bendTo, start + dur);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(vol, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
      }
      whistle(ctx) {
        const n = ctx.currentTime;
        [784, 988, 1175, 988, 784, 880, 988].forEach((f, i) => this.tone(ctx, f, n + i * 0.32, 0.26, 'sine', 0.07));
      }
      slip(ctx) { this.tone(ctx, 300, ctx.currentTime, 0.3, 'sine', 0.2, 1500); }
      thud(ctx) {
        const n = ctx.currentTime;
        this.tone(ctx, 140, n, 0.35, 'sine', 0.35, 45);
        this.tone(ctx, 90, n, 0.25, 'triangle', 0.2, 40);
      }
      tweets(ctx) {
        const n = ctx.currentTime;
        [0, 0.22, 0.44, 0.66].forEach((d, i) => this.tone(ctx, i % 2 ? 2200 : 2600, n + d, 0.12, 'sine', 0.06, i % 2 ? 2600 : 2200));
      }
      monkey(ctx) {
        const n = ctx.currentTime;
        [[500, 800], [500, 820], [700, 1200], [700, 1250]].forEach(([a, b], i) =>
          this.tone(ctx, a, n + i * 0.18, 0.15, 'square', 0.05, b));
      }
      hey(ctx) {
        const n = ctx.currentTime;
        this.tone(ctx, 392, n, 0.14, 'sawtooth', 0.08);
        this.tone(ctx, 523, n + 0.14, 0.22, 'sawtooth', 0.08);
      }
      chase(ctx) {
        const n = ctx.currentTime;
        const seq = [523, 587, 659, 698, 784, 698, 659, 587, 523, 587, 659, 784];
        seq.forEach((f, i) => this.tone(ctx, f, n + i * 0.18, 0.12, 'triangle', 0.08));
      }
      wahWah(ctx) {
        const n = ctx.currentTime;
        [[349, 0], [330, 0.35], [311, 0.7]].forEach(([f, d]) => this.tone(ctx, f, n + d, 0.32, 'sawtooth', 0.07));
        this.tone(ctx, 294, n + 1.05, 0.9, 'sawtooth', 0.07, 247);
      }
    }
    const sfx = new CartoonSFX();

    // -------------------------------------------------------------------------
    // ELEMENT REFERENCES (cached once; no layout reads in the frame loop)
    // -------------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const el = {
      boyRoot: $('boyRoot'), boyHead: $('boyHead'), armF: $('armF'), armB: $('armB'), legF: $('legF'), legB: $('legB'),
      boyCap: $('boyCap'), faceHappy: $('faceHappy'), faceShock: $('faceShock'), faceDizzy: $('faceDizzy'), faceAngry: $('faceAngry'),
      peel: $('peel'), capWorld: $('capWorld'),
      monkeyRoot: $('monkeyRoot'), mHead: $('mHead'), mArmF: $('mArmF'), mArmB: $('mArmB'), mLegF: $('mLegF'), mLegB: $('mLegB'),
      monkeyTail: $('monkeyTail'), monkeyCap: $('monkeyCap'),
      mFaceNormal: $('mFaceNormal'), mFaceSurprised: $('mFaceSurprised'), mFaceCheeky: $('mFaceCheeky'),
      notes: $('notes'), note1: $('note1'), note2: $('note2'),
      whoops: $('whoops'), poof: $('poof'), dizzyStars: $('dizzyStars'), star1: $('star1'), star2: $('star2'), star3: $('star3'),
      bubbleBang: $('bubbleBang'), bubbleHee: $('bubbleHee'), bubbleHey: $('bubbleHey'),
      penaltyBanner: $('penaltyBanner'), cloud1: $('cloud1'), cloud2: $('cloud2'),
    };
    const setT = (node, v) => node.setAttribute('transform', v);
    const setO = (node, v) => node.setAttribute('opacity', v.toFixed ? v.toFixed(2) : v);

    const HIP_STAND = 352;
    const HIP_LYING = 388;
    const CAP_REST = { x: 525, y: 398 };

    // Pop-in scale for comic text / bubbles: 0 → overshoot → 1, then fade out at the end.
    function popAlpha(t, a, b) {
      if (t < a || t > b) return { s: 0, o: 0 };
      const s = easeOutBack(invLerp(a, a + 0.25, t));
      const o = 1 - invLerp(b - 0.2, b, t);
      return { s: Math.max(0, s), o };
    }

    // -------------------------------------------------------------------------
    // RENDER (pure function of time → deterministic replay)
    // -------------------------------------------------------------------------
    function renderAtTime(t) {
      // Drifting clouds
      setT(el.cloud1, `translate(${(120 + t * 6).toFixed(1)}, 80)`);
      setT(el.cloud2, `translate(${(430 + t * 4).toFixed(1)}, 55)`);

      // ---------------- BOY ----------------
      let bx = 110, by = HIP_STAND, rot = 0;
      let legF = 0, legB = 0, armF = 0, armB = 0, headRot = 0;
      let face = 'happy';

      if (t < 3.0) {
        // Happy stroll
        const cyc = t * Math.PI * 2 * 1.6;
        bx = lerp(110, 400, t / 3.0);
        legF = 24 * Math.sin(cyc);
        legB = -legF;
        armF = -22 * Math.sin(cyc);
        armB = -armF;
        by = HIP_STAND - Math.abs(Math.sin(cyc)) * 3;
        headRot = Math.sin(cyc * 0.5) * 4;
      } else if (t < 3.55) {
        // Slip! Feet fly up, body tips backward, lands flat
        const p = invLerp(3.0, 3.55, t);
        bx = lerp(400, 418, p);
        by = lerp(HIP_STAND, HIP_LYING, p) - Math.sin(p * Math.PI) * 42;
        rot = -92 * easeOutCubic(clamp(p * 1.15, 0, 1));
        legF = -60 * Math.sin(p * Math.PI) - 8;
        legB = -38 * Math.sin(p * Math.PI);
        armF = -160 * Math.sin(p * Math.PI);
        armB = -120 * Math.sin(p * Math.PI);
        face = 'shock';
      } else if (t < 5.8) {
        // Flat on his back, dazed
        const q = invLerp(3.55, 3.8, t);
        bx = 418;
        by = HIP_LYING - Math.sin(q * Math.PI) * 5;
        rot = -90 + Math.sin(q * Math.PI) * 4;
        legF = -12 + Math.sin(t * 2.2) * 3;
        legB = -4;
        armF = -70;
        armB = -110;
        headRot = Math.sin(t * 3) * 6;
        face = t < 5.45 ? 'dizzy' : 'shock';
      } else if (t < 6.3) {
        // Springs back up
        const p = easeOutBack(invLerp(5.8, 6.3, t));
        bx = 418;
        rot = lerp(-90, 0, p);
        by = lerp(HIP_LYING, HIP_STAND, p);
        legF = lerp(-12, 0, p);
        legB = lerp(-4, 0, p);
        armF = lerp(-70, -105, p);
        armB = lerp(-110, -20, p);
        face = 'shock';
      } else if (t < 6.9) {
        // "HEY! MY CAP!" — pointing at the monkey, stomping
        bx = 418;
        by = HIP_STAND - Math.abs(Math.sin(t * 14)) * 3;
        armF = -105 + Math.sin(t * 18) * 6;
        armB = -20;
        face = 'angry';
      } else {
        // The chase!
        const p = invLerp(6.9, 10.4, t);
        const cyc = t * Math.PI * 2 * 3.0;
        bx = lerp(418, 990, easeInQuad(p) * 0.55 + p * 0.45);
        by = HIP_STAND - Math.abs(Math.sin(cyc)) * 6;
        rot = 12;
        legF = 40 * Math.sin(cyc);
        legB = -legF;
        armF = -45 * Math.sin(cyc) - 20;
        armB = 45 * Math.sin(cyc) - 20;
        face = 'angry';
      }

      setT(el.boyRoot, `translate(${bx.toFixed(1)}, ${by.toFixed(1)}) rotate(${rot.toFixed(1)})`);
      setT(el.boyHead, `translate(0, -66) rotate(${headRot.toFixed(1)})`);
      setT(el.legF, `translate(3, 0) rotate(${legF.toFixed(1)})`);
      setT(el.legB, `translate(-3, 0) rotate(${legB.toFixed(1)})`);
      setT(el.armF, `translate(0, -44) rotate(${armF.toFixed(1)})`);
      setT(el.armB, `translate(0, -44) rotate(${armB.toFixed(1)})`);
      setO(el.faceHappy, face === 'happy' ? 1 : 0);
      setO(el.faceShock, face === 'shock' ? 1 : 0);
      setO(el.faceDizzy, face === 'dizzy' ? 1 : 0);
      setO(el.faceAngry, face === 'angry' ? 1 : 0);

      // Head world position (for stars / speech bubbles)
      const r = rot * DEG;
      const headX = bx + 66 * Math.sin(r);
      const headY = by - 66 * Math.cos(r);

      // Whistling notes while walking
      if (t < 3.0) {
        setO(el.notes, 1 - invLerp(2.7, 3.0, t));
        const f1 = (t * 0.9) % 1, f2 = (t * 0.9 + 0.5) % 1;
        el.note1.setAttribute('x', (headX + 22 + f1 * 14).toFixed(1));
        el.note1.setAttribute('y', (headY - 26 - f1 * 34).toFixed(1));
        el.note1.setAttribute('opacity', (1 - f1).toFixed(2));
        el.note2.setAttribute('x', (headX + 30 + f2 * 10).toFixed(1));
        el.note2.setAttribute('y', (headY - 22 - f2 * 34).toFixed(1));
        el.note2.setAttribute('opacity', (1 - f2).toFixed(2));
        sfx.triggerOnce('whistle', (c) => sfx.whistle(c));
      } else {
        setO(el.notes, 0);
      }

      // ---------------- BANANA PEEL ----------------
      if (t < 3.0) {
        setT(el.peel, 'translate(420, 404)');
      } else {
        const p = easeOutCubic(invLerp(3.0, 3.5, t));
        const px = lerp(420, 610, p);
        const py = 404 - Math.sin(p * Math.PI) * 14;
        setT(el.peel, `translate(${px.toFixed(1)}, ${py.toFixed(1)}) rotate(${(p * 380).toFixed(1)})`);
      }
      if (t >= 3.0) sfx.triggerOnce('slip', (c) => sfx.slip(c));

      const w = popAlpha(t, 3.05, 3.95);
      setO(el.whoops, w.o);
      setT(el.whoops, `translate(470, 300) scale(${w.s.toFixed(2)}) rotate(-8)`);

      // Landing dust + THUD
      const pf = popAlpha(t, 3.55, 4.35);
      setO(el.poof, pf.o * 0.95);
      setT(el.poof, `translate(385, 398) scale(${(0.6 + pf.s * 0.5).toFixed(2)})`);
      if (t >= 3.55) sfx.triggerOnce('thud', (c) => sfx.thud(c));

      // Dizzy stars orbiting the head while lying down
      if (t >= 3.7 && t < 5.5) {
        setO(el.dizzyStars, Math.min(1, invLerp(3.7, 3.9, t)) * (1 - invLerp(5.3, 5.5, t)));
        const stars = [el.star1, el.star2, el.star3];
        stars.forEach((s, i) => {
          const a = t * 5 + (i * Math.PI * 2) / 3;
          s.setAttribute('x', (headX + Math.cos(a) * 28).toFixed(1));
          s.setAttribute('y', (headY - 34 + Math.sin(a) * 7).toFixed(1));
        });
        sfx.triggerOnce('tweets', (c) => sfx.tweets(c));
      } else {
        setO(el.dizzyStars, 0);
      }

      // ---------------- CAP ----------------
      const CAP_FLY_START = 3.12, CAP_LAND = 3.95, CAP_GRAB = 5.2;
      setO(el.boyCap, t < CAP_FLY_START ? 1 : 0);
      if (t >= CAP_FLY_START && t < CAP_GRAB) {
        setO(el.capWorld, 1);
        let cx, cy, cr;
        if (t < CAP_LAND) {
          const p = invLerp(CAP_FLY_START, CAP_LAND, t);
          cx = lerp(372, CAP_REST.x, p);
          cy = lerp(282, CAP_REST.y, p) - Math.sin(p * Math.PI) * 130;
          cr = p * 720;
        } else {
          const q = invLerp(CAP_LAND, CAP_LAND + 0.25, t);
          cx = CAP_REST.x;
          cy = CAP_REST.y - Math.sin(q * Math.PI) * 8;
          cr = 0;
        }
        setT(el.capWorld, `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) rotate(${cr.toFixed(1)})`);
      } else {
        setO(el.capWorld, 0);
      }

      // ---------------- MONKEY ----------------
      let mx = 650, my = 400, mRot = 0, flip = 1;
      let mArmF = 15, mArmB = -15, mLegF = 0, mLegB = 0, mHeadRot = 0, tail = Math.sin(t * 3) * 10;
      let mFace = 'normal';

      if (t < 4.4) {
        // Lounging under the tree, scratching its head
        mHeadRot = Math.sin(t * 1.5) * 5;
        mArmB = -150 + Math.sin(t * 9) * 12;
        mLegF = -30;
        mLegB = 20;
        if (t >= 3.6) mFace = 'surprised';
      } else if (t < 5.15) {
        // Hop-hop-hop over to the cap
        const p = invLerp(4.4, 5.15, t);
        mx = lerp(650, 552, easeInOutCubic(p));
        my = 400 - Math.abs(Math.sin(p * Math.PI * 3)) * 22;
        mLegF = -25 * Math.abs(Math.sin(p * Math.PI * 3));
        mLegB = 25 * Math.abs(Math.sin(p * Math.PI * 3));
        mArmF = 40;
        mArmB = -40;
        tail = 18;
        mFace = 'cheeky';
      } else if (t < 5.45) {
        // Bend down and snatch it
        const p = invLerp(5.15, 5.45, t);
        mx = 552;
        mRot = -28 * Math.sin(p * Math.PI);
        mArmF = lerp(55, 160, p);
        mFace = 'cheeky';
      } else if (t < 6.5) {
        // Cheeky victory dance
        mx = 552;
        my = 400 - Math.abs(Math.sin(t * 10)) * 7;
        mRot = Math.sin(t * 8) * 9;
        mArmF = 150 + Math.sin(t * 12) * 20;
        mArmB = -150 - Math.sin(t * 12) * 20;
        mLegF = Math.sin(t * 10) * 15;
        mLegB = -mLegF;
        tail = Math.sin(t * 10) * 22;
        mFace = 'cheeky';
      } else {
        // Run away (to the right)
        const p = invLerp(6.5, 9.8, t);
        const cyc = t * Math.PI * 2 * 4;
        mx = lerp(552, 1010, easeInQuad(p) * 0.4 + p * 0.6);
        my = 400 - Math.abs(Math.sin(cyc)) * 10;
        flip = -1;
        mRot = -10;
        mLegF = 40 * Math.sin(cyc);
        mLegB = -mLegF;
        mArmF = 60 * Math.sin(cyc);
        mArmB = -60 * Math.sin(cyc);
        tail = 25 + Math.sin(cyc) * 12;
        mFace = 'cheeky';
      }

      setT(el.monkeyRoot, `translate(${mx.toFixed(1)}, ${my.toFixed(1)}) scale(${flip}, 1) rotate(${mRot.toFixed(1)})`);
      setT(el.mHead, `translate(-3, -56) rotate(${mHeadRot.toFixed(1)})`);
      setT(el.mArmF, `translate(-4, -40) rotate(${mArmF.toFixed(1)})`);
      setT(el.mArmB, `translate(6, -40) rotate(${mArmB.toFixed(1)})`);
      setT(el.mLegF, `translate(-6, -12) rotate(${mLegF.toFixed(1)})`);
      setT(el.mLegB, `translate(6, -12) rotate(${mLegB.toFixed(1)})`);
      setT(el.monkeyTail, `translate(12, -18) rotate(${tail.toFixed(1)})`);
      setO(el.mFaceNormal, mFace === 'normal' ? 1 : 0);
      setO(el.mFaceSurprised, mFace === 'surprised' ? 1 : 0);
      setO(el.mFaceCheeky, mFace === 'cheeky' ? 1 : 0);

      if (t >= CAP_GRAB) {
        const s = 0.8 * easeOutBack(invLerp(CAP_GRAB, CAP_GRAB + 0.3, t));
        setO(el.monkeyCap, 1);
        setT(el.monkeyCap, `translate(1, -9) scale(${Math.max(0, s).toFixed(2)})`);
      } else {
        setO(el.monkeyCap, 0);
      }

      // Monkey "!" when the boy crashes
      const bang = popAlpha(t, 3.65, 4.35);
      setO(el.bubbleBang, bang.o);
      setT(el.bubbleBang, `translate(${(mx - 4).toFixed(1)}, ${(my - 104).toFixed(1)}) scale(${bang.s.toFixed(2)})`);

      // "Hee hee!"
      const hee = popAlpha(t, 5.5, 6.5);
      setO(el.bubbleHee, hee.o);
      setT(el.bubbleHee, `translate(${(mx - 8).toFixed(1)}, ${(my - 120).toFixed(1)}) scale(${hee.s.toFixed(2)})`);
      if (t >= 5.5) sfx.triggerOnce('monkey', (c) => sfx.monkey(c));

      // "HEY! MY CAP!"
      const hey = popAlpha(t, 6.15, 7.4);
      setO(el.bubbleHey, hey.o);
      setT(el.bubbleHey, `translate(${(Math.min(headX, 680) + 20).toFixed(1)}, ${(headY - 66).toFixed(1)}) scale(${hey.s.toFixed(2)})`);
      if (t >= 6.15) sfx.triggerOnce('hey', (c) => sfx.hey(c));
      if (t >= 6.9) sfx.triggerOnce('chase', (c) => sfx.chase(c));

      // ---------------- PENALTY BANNER ----------------
      if (t >= 9.6) {
        const bp = easeOutBack(invLerp(9.6, 10.0, t));
        setT(el.penaltyBanner, `translate(400, ${lerp(-80, 60, bp).toFixed(1)})`);
        sfx.triggerOnce('wah', (c) => sfx.wahWah(c));
      } else {
        setT(el.penaltyBanner, 'translate(400, -80)');
      }
    }

    // -------------------------------------------------------------------------
    // ANIMATION LOOP & REPLAY (loop stops once the story finishes)
    // -------------------------------------------------------------------------
    let animStartTime = null;
    let currentTime = 0;
    let isPlaying = true;
    let rafId = null;

    function tick(now) {
      if (!animStartTime) animStartTime = now - currentTime * 1000;
      if (isPlaying) {
        currentTime = (now - animStartTime) / 1000;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          isPlaying = false;
        }
        renderAtTime(currentTime);
      }
      if (isPlaying) rafId = requestAnimationFrame(tick);
    }

    function replay() {
      cancelAnimationFrame(rafId);
      sfx.resetTriggers();
      sfx.init();
      currentTime = 0;
      animStartTime = null;
      isPlaying = true;
      renderAtTime(0);
      rafId = requestAnimationFrame(tick);
    }

    document.body.addEventListener('click', replay);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR') {
        e.preventDefault();
        replay();
      }
    });

    // `?at=<seconds>` freezes a single frame (handy for previewing/screenshots)
    const freezeAt = parseFloat(urlParams.get('at'));
    if (Number.isFinite(freezeAt)) {
      sfx.enabled = false;
      renderAtTime(clamp(freezeAt, 0, TOTAL_DURATION));
    } else {
      renderAtTime(0);
      rafId = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
