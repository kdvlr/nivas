<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chores Completed - GSAP Vector Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #f8fafc 0%, #e2e8f0 100%);
            color: #334155;
            overflow-x: hidden;
        }
        .font-display {
            font-family: 'Fredoka', sans-serif;
        }
        /* Custom range slider for timeline scrubbing */
        input[type=range].scrubber {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].scrubber::-webkit-slider-runnable-track {
            background: #cbd5e1;
            height: 8px;
            border-radius: 999px;
        }
        input[type=range].scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #3b82f6;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(51, 65, 85, 0.25);
            transition: transform 0.15s ease;
        }
        input[type=range].scrubber::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background-color: #2563eb;
        }
        .svg-stage {
            box-shadow: 0 20px 45px -12px rgba(51, 65, 85, 0.18), 0 0 0 1px rgba(100, 116, 139, 0.2);
        }
        /* Building starts dark/unlit in shadow until power-on */
        #buildingContainer {
            filter: brightness(var(--bldg-bright, 0.16)) saturate(var(--bldg-sat, 0.15)) contrast(1.1) drop-shadow(0px 6px 5px rgba(15, 23, 42, 0.45));
        }

        /* Embed iframe mode for celebration overlay */
        body.embed {
            padding: 0 !important;
            margin: 0 !important;
            background: #0f172a !important;
            overflow: hidden !important;
            min-height: 100vh !important;
            height: 100vh !important;
            width: 100vw !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        body.embed #towerHeader,
        body.embed #towerControls,
        body.embed #timerBadge,
        body.embed #timeDisplay {
            display: none !important;
        }
        body.embed > div.w-full {
            max-width: 100vw !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            gap: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        body.embed .svg-stage {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            background: transparent !important;
            aspect-ratio: auto !important;
        }
        body.embed svg#animationStage {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 select-none">

    <div class="w-full max-w-4xl flex flex-col gap-4">
        
        <!-- Top Header -->
        <div id="towerHeader" class="flex flex-wrap items-center justify-between gap-3 bg-white/85 backdrop-blur-md border border-slate-200/90 px-5 py-3.5 rounded-2xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-sky-100 border border-sky-200 flex items-center justify-center text-sky-600">
                    <i class="ph-fill ph-buildings text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-display text-lg sm:text-xl font-bold tracking-wide text-slate-700 flex items-center gap-2">
                        ChoreTower <span class="text-xs font-sans font-semibold px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-700 border border-sky-200">GSAP Vector</span>
                    </h1>
                    <p class="text-xs text-slate-500">Bottom-up floor stacking (S-E-R-O-H-C) • 7.5s Total Runtime</p>
                </div>
            </div>

            <!-- Sound & Status Controls -->
            <div class="flex items-center gap-2.5">
                <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-700">
                    <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse" id="statusDot"></span>
                    <span id="statusText">Constructing...</span>
                </div>
                <button id="soundBtn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200/70 border border-slate-200 text-xs font-semibold text-slate-700 transition active:scale-95" title="Toggle Synthesized Sound Effects">
                    <i id="soundIcon" class="ph-fill ph-speaker-slash text-base text-slate-400"></i>
                    <span id="soundLabel">SFX Off</span>
                </button>
            </div>
        </div>

        <div class="relative w-full aspect-[4/3] sm:aspect-[16/10] rounded-3xl overflow-hidden svg-stage bg-sky-50/40">
            
            <svg id="animationStage" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice" class="w-full h-full block">
                <defs>
                    <!-- Soft Cool Morning Sky Gradient -->
                    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#bae6fd" />
                        <stop offset="55%" stop-color="#e0f2fe" />
                        <stop offset="100%" stop-color="#f8fafc" />
                    </linearGradient>

                    <!-- Soft Pastel Night Sky Gradient -->
                    <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#0f172a" />
                        <stop offset="55%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#334155" />
                    </linearGradient>

                    <!-- Soft Warm Sun Glow -->
                    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
                        <stop offset="60%" stop-color="#fde047" stop-opacity="0.35" />
                        <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
                    </radialGradient>

                    <!-- Soft Pastel Moon Glow -->
                    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.65" />
                        <stop offset="55%" stop-color="#bae6fd" stop-opacity="0.22" />
                        <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
                    </radialGradient>

                    <!-- Pastel Ice-Blue Window Glass Reflection -->
                    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f0f9ff" />
                        <stop offset="55%" stop-color="#bae6fd" />
                        <stop offset="100%" stop-color="#7dd3fc" />
                    </linearGradient>

                    <!-- Warm Illuminated Night Window Gradient -->
                    <linearGradient id="litWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fef9c3" />
                        <stop offset="55%" stop-color="#fde047" />
                        <stop offset="100%" stop-color="#facc15" />
                    </linearGradient>

                    <!-- Warm Window Outer Glow -->
                    <filter id="windowGlow" x="-35%" y="-35%" width="170%" height="170%">
                        <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#fde047" flood-opacity="0.7" />
                    </filter>

                    <!-- Soft Cool Shadow for Building & Banner -->
                    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22" />
                    </filter>

                    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="1.5" stdDeviation="0.5" flood-color="#334155" flood-opacity="0.16" />
                    </filter>

                    <!-- Reusable Window Pair (Supports Dark Unlit State & Warm Lit Night State) -->
                    <g id="windowPair">
                        <!-- Unlit Dark Glass -->
                        <rect x="0" y="0" width="26" height="30" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
                        <!-- Nighttime Warm Illuminated Pane (Fades in via CSS variable --win-lit) -->
                        <rect x="0" y="0" width="26" height="30" rx="4" fill="url(#litWindowGrad)" stroke="#475569" stroke-width="2" filter="url(#windowGlow)" style="opacity: var(--win-lit, 0)" />
                        <!-- Window Mullions -->
                        <line x1="0" y1="15" x2="26" y2="15" stroke="#334155" stroke-width="1.5" opacity="0.6" />
                        <line x1="13" y1="0" x2="13" y2="30" stroke="#334155" stroke-width="1.5" opacity="0.6" />
                        <!-- Glass Glint (Appears when lit) -->
                        <polygon points="3,3 11,3 4,27 3,27" fill="#ffffff" style="opacity: calc(var(--win-lit, 0) * 0.65)" />
                        <!-- Window Sill -->
                        <rect x="-2" y="28" width="30" height="4" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1.2" />
                    </g>
                </defs>

                <!-- 1. BACKGROUND SKY (DAY TO NIGHT TRANSITION) -->
                <rect width="800" height="520" fill="url(#skyGrad)" />
                <rect id="nightSkyRect" width="800" height="520" fill="url(#nightSkyGrad)" opacity="0" />

                <!-- Twinkling Night Stars Layer -->
                <g id="starsGroup" opacity="0">
                    <circle class="twinkle-star" cx="65" cy="55" r="1.8" fill="#fef9c3" />
                    <circle class="twinkle-star" cx="195" cy="35" r="2.2" fill="#e0f2fe" />
                    <circle class="twinkle-star" cx="250" cy="115" r="1.5" fill="#fef08a" />
                    <circle class="twinkle-star" cx="330" cy="45" r="2" fill="#f8fafc" />
                    <circle class="twinkle-star" cx="465" cy="32" r="1.6" fill="#bae6fd" />
                    <circle class="twinkle-star" cx="545" cy="78" r="2.3" fill="#fef9c3" />
                    <circle class="twinkle-star" cx="615" cy="40" r="1.5" fill="#f8fafc" />
                    <circle class="twinkle-star" cx="755" cy="65" r="2.1" fill="#fde047" />
                    <circle class="twinkle-star" cx="725" cy="175" r="1.7" fill="#e0f2fe" />
                    <circle class="twinkle-star" cx="585" cy="185" r="1.6" fill="#fef9c3" />
                    <circle class="twinkle-star" cx="215" cy="185" r="1.9" fill="#f8fafc" />
                    <circle class="twinkle-star" cx="55" cy="160" r="1.5" fill="#bae6fd" />
                    <!-- 4-Point Sparkle Stars -->
                    <path class="twinkle-star" d="M295,75 L297,81 L303,83 L297,85 L295,91 L293,85 L287,83 L293,81 Z" fill="#fef08a" />
                    <path class="twinkle-star" d="M640,120 L642,126 L648,128 L642,130 L640,136 L638,130 L632,128 L638,126 Z" fill="#e0f2fe" />
                </g>
                
                <!-- Sun (Sets during construction) -->
                <g id="sunGroup" transform="translate(680, 95)">
                    <circle id="sunHalo" cx="0" cy="0" r="72" fill="url(#sunGlow)" />
                    <circle cx="0" cy="0" r="32" fill="#fde047" />
                </g>

                <!-- Crescent Moon (Rises as night falls) -->
                <g id="moonGroup" transform="translate(680, 260)" opacity="0">
                    <circle id="moonHalo" cx="0" cy="0" r="68" fill="url(#moonGlow)" />
                    <path d="M-8,-28 A30,30 0 1,0 24,18 A24,24 0 1,1 -8,-28 Z" fill="#fef9c3" stroke="#fde047" stroke-width="1" />
                </g>

                <!-- Floating Fluffy Clouds -->
                <g id="cloudsLayer" opacity="0.9">
                    <g id="cloud1" transform="translate(90, 90)">
                        <path d="M20,35 Q10,35 10,25 Q10,14 22,14 Q27,2 42,4 Q56,4 60,16 Q72,16 72,26 Q72,35 60,35 Z" fill="#ffffff" />
                    </g>
                    <g id="cloud2" transform="translate(560, 145) scale(1.2)">
                        <path d="M20,35 Q10,35 10,25 Q10,14 22,14 Q27,2 42,4 Q56,4 60,16 Q72,16 72,26 Q72,35 60,35 Z" fill="#ffffff" />
                    </g>
                    <g id="cloud3" transform="translate(270, 60) scale(0.85)">
                        <path d="M20,35 Q10,35 10,25 Q10,14 22,14 Q27,2 42,4 Q56,4 60,16 Q72,16 72,26 Q72,35 60,35 Z" fill="#ffffff" />
                    </g>
                </g>

                <!-- Distant Cool Slate Silhouette & Soft Mint/Sage Rolling Hills -->
                <g opacity="0.45">
                    <rect x="60" y="340" width="45" height="110" fill="#cbd5e1" rx="3" />
                    <rect x="115" y="365" width="38" height="85" fill="#94a3b8" rx="3" />
                    <rect x="620" y="330" width="52" height="120" fill="#cbd5e1" rx="3" />
                    <rect x="680" y="360" width="40" height="90" fill="#94a3b8" rx="3" />
                    <!-- Distant Tiny City Lights at Night -->
                    <g id="distantCityLights" opacity="0" fill="#fde047">
                        <rect x="70" y="355" width="6" height="8" rx="1" />
                        <rect x="85" y="355" width="6" height="8" rx="1" />
                        <rect x="70" y="375" width="6" height="8" rx="1" />
                        <rect x="125" y="380" width="6" height="8" rx="1" />
                        <rect x="632" y="348" width="7" height="9" rx="1" />
                        <rect x="650" y="348" width="7" height="9" rx="1" />
                        <rect x="632" y="370" width="7" height="9" rx="1" />
                        <rect x="692" y="375" width="6" height="8" rx="1" />
                    </g>
                </g>
                <path id="hillBack" d="M0,445 Q210,395 430,440 T800,425 L800,520 L0,520 Z" fill="#bbf7d0" opacity="0.6" />
                <path id="hillFront" d="M0,455 Q190,420 400,448 T800,440 L800,520 L0,520 Z" fill="#86efac" opacity="0.55" />

                <!-- 2. TOWER CRANE (LEFT SIDE - Pastel Ochre Amber & Steel Blue) -->
                <g id="craneSystem">
                    <!-- Crane Base & Mast -->
                    <rect x="108" y="425" width="44" height="25" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
                    <g stroke="#64748b" stroke-width="2.5" fill="none">
                        <rect x="118" y="42" width="24" height="385" fill="#e2e8f0" fill-opacity="0.55" />
                        <!-- Lattice Crossbars -->
                        <path d="M118,42 L142,75 L118,110 L142,145 L118,180 L142,215 L118,250 L142,285 L118,320 L142,355 L118,390 L142,425" />
                        <path d="M142,42 L118,75 L142,110 L118,145 L142,180 L118,215 L142,250 L118,285 L142,320 L118,355 L142,390 L118,425" />
                    </g>
                    <!-- Top Mast Peak & Support Cables -->
                    <polygon points="118,42 130,10 142,42" fill="#fcd34d" stroke="#475569" stroke-width="2.5" />
                    <line x1="130" y1="12" x2="72" y2="42" stroke="#64748b" stroke-width="1.8" />
                    <line x1="130" y1="12" x2="395" y2="42" stroke="#64748b" stroke-width="1.8" />
                    <line x1="130" y1="12" x2="510" y2="42" stroke="#64748b" stroke-width="1.8" />
                    
                    <!-- Counterweight Jib -->
                    <rect x="62" y="40" width="58" height="10" rx="2" fill="#fde68a" stroke="#475569" stroke-width="2" />
                    <rect x="68" y="24" width="26" height="24" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
                    
                    <!-- Horizontal Main Jib Arm (Pastel Construction Amber/Ochre) -->
                    <rect x="118" y="38" width="425" height="12" rx="3" fill="#fde68a" stroke="#475569" stroke-width="2" />
                    <path d="M142,50 L165,38 L188,50 L211,38 L234,50 L257,38 L280,50 L303,38 L326,50 L349,38 L372,50 L395,38 L418,50 L441,38 L464,50 L487,38 L510,50 L533,38" stroke="#64748b" stroke-width="1.6" fill="none" />
                    
                    <!-- Operator Cabin -->
                    <rect x="136" y="54" width="24" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                    <rect id="cabinWindow" x="142" y="58" width="15" height="14" rx="2" fill="#bae6fd" stroke="#475569" stroke-width="1.5" />

                    <!-- Moving Trolley & Hook Assembly -->
                    <g id="craneTrolley" transform="translate(400, 50)">
                        <!-- Vertical Hoist Cable -->
                        <line id="craneCable" x1="0" y1="0" x2="0" y2="90" stroke="#475569" stroke-width="2.5" />
                        <!-- Trolley Car -->
                        <rect x="-16" y="-5" width="32" height="12" rx="3" fill="#7dd3fc" stroke="#475569" stroke-width="2" />
                        <circle cx="-9" cy="1" r="3" fill="#f8fafc" />
                        <circle cx="9" cy="1" r="3" fill="#f8fafc" />
                        
                        <!-- Pulley & Sling Cables (attached to bottom of cable) -->
                        <g id="craneHook" transform="translate(0, 90)">
                            <g id="slingCables" opacity="0">
                                <line x1="0" y1="6" x2="-95" y2="38" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2" />
                                <line x1="0" y1="6" x2="95" y2="38" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2" />
                            </g>
                            <rect x="-10" y="-6" width="20" height="14" rx="4" fill="#fcd34d" stroke="#475569" stroke-width="2" />
                            <path d="M0,8 L0,15 C0,22 -10,22 -10,16" stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="round" />
                        </g>
                    </g>
                </g>

                <!-- 3. THE CHORE BUILDING (6 BOYISH PASTEL FLOORS: S - E - R - O - H - C) -->
                <g id="buildingContainer">
                    
                    <!-- Soft Cool Stone Foundation -->
                    <g id="foundation">
                        <rect x="255" y="438" width="290" height="14" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
                        <rect x="270" y="428" width="260" height="12" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
                    </g>

                    <!-- FLOOR 1 (Bottom): "S" - Pastel Steel Slate Blue (y: 380 to 428) -->
                    <g id="floor-S" class="building-floor" data-letter="S">
                        <rect x="280" y="380" width="240" height="48" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
                        <rect x="275" y="378" width="250" height="6" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
                        <use href="#windowPair" x="298" y="390" />
                        <use href="#windowPair" x="334" y="390" />
                        <use href="#windowPair" x="440" y="390" />
                        <use href="#windowPair" x="476" y="390" />
                        <rect x="376" y="384" width="48" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                        <text x="400" y="413" text-anchor="middle" class="font-display" font-size="28" font-weight="700" fill="#334155" filter="url(#letterShadow)">S</text>
                    </g>

                    <!-- FLOOR 2: "E" - Pastel Terracotta Sandstone (y: 332 to 380) -->
                    <g id="floor-E" class="building-floor" data-letter="E">
                        <rect x="280" y="332" width="240" height="48" rx="3" fill="#fed7aa" stroke="#475569" stroke-width="2" />
                        <rect x="275" y="330" width="250" height="6" rx="2" fill="#fdba74" stroke="#475569" stroke-width="1.5" />
                        <use href="#windowPair" x="298" y="342" />
                        <use href="#windowPair" x="334" y="342" />
                        <use href="#windowPair" x="440" y="342" />
                        <use href="#windowPair" x="476" y="342" />
                        <rect x="376" y="336" width="48" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                        <text x="400" y="365" text-anchor="middle" class="font-display" font-size="28" font-weight="700" fill="#c2410c" filter="url(#letterShadow)">E</text>
                    </g>

                    <!-- FLOOR 3: "R" - Pastel Golden Ochre (y: 284 to 332) -->
                    <g id="floor-R" class="building-floor" data-letter="R">
                        <rect x="280" y="284" width="240" height="48" rx="3" fill="#fde68a" stroke="#475569" stroke-width="2" />
                        <rect x="275" y="282" width="250" height="6" rx="2" fill="#fcd34d" stroke="#475569" stroke-width="1.5" />
                        <use href="#windowPair" x="298" y="294" />
                        <use href="#windowPair" x="334" y="294" />
                        <use href="#windowPair" x="440" y="294" />
                        <use href="#windowPair" x="476" y="294" />
                        <rect x="376" y="288" width="48" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                        <text x="400" y="317" text-anchor="middle" class="font-display" font-size="28" font-weight="700" fill="#b45309" filter="url(#letterShadow)">R</text>
                    </g>

                    <!-- FLOOR 4: "O" - Pastel Sage Mint Green (y: 236 to 284) -->
                    <g id="floor-O" class="building-floor" data-letter="O">
                        <rect x="280" y="236" width="240" height="48" rx="3" fill="#bbf7d0" stroke="#475569" stroke-width="2" />
                        <rect x="275" y="234" width="250" height="6" rx="2" fill="#86efac" stroke="#475569" stroke-width="1.5" />
                        <use href="#windowPair" x="298" y="246" />
                        <use href="#windowPair" x="334" y="246" />
                        <use href="#windowPair" x="440" y="246" />
                        <use href="#windowPair" x="476" y="246" />
                        <rect x="376" y="240" width="48" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                        <text x="400" y="269" text-anchor="middle" class="font-display" font-size="28" font-weight="700" fill="#15803d" filter="url(#letterShadow)">O</text>
                    </g>

                    <!-- FLOOR 5: "H" - Pastel Seafoam Teal (y: 188 to 236) -->
                    <g id="floor-H" class="building-floor" data-letter="H">
                        <rect x="280" y="188" width="240" height="48" rx="3" fill="#99f6e4" stroke="#475569" stroke-width="2" />
                        <rect x="275" y="186" width="250" height="6" rx="2" fill="#5eead4" stroke="#475569" stroke-width="1.5" />
                        <use href="#windowPair" x="298" y="198" />
                        <use href="#windowPair" x="334" y="198" />
                        <use href="#windowPair" x="440" y="198" />
                        <use href="#windowPair" x="476" y="198" />
                        <rect x="376" y="192" width="48" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
                        <text x="400" y="221" text-anchor="middle" class="font-display" font-size="28" font-weight="700" fill="#0f766e" filter="url(#letterShadow)">H</text>

                    <!-- FLOOR 6 (Top): "C" - Pastel Denim Sky Blue (y: 140 to 188) -->

    <script>
        const urlParams = new URLSearchParams(location.search);
        if (urlParams.has("embed")) {
            document.body.classList.add("embed");
        }

        // ============================================================================
        // 1. SYNTHESIZED SOUND ENGINE (Tone.js - Zero external audio files required)
        // ============================================================================
        let soundEnabled = false;
        let synthsInitialized = false;
        let thudSynth, popSynth, fanfareSynth;

        async function initAudio() {
            if (synthsInitialized) return;
            await Tone.start();
            
            // Deep impact sound when a floor lands
            thudSynth = new Tone.MembraneSynth({
                pitchDecay: 0.04,
                octaves: 4,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.2 }
            }).toDestination();
            thudSynth.volume.value = -8;

            // Ascending chime per floor S-E-R-O-H-C
            popSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.3 }
            }).toDestination();
            popSynth.volume.value = -10;

            // Victory celebration chord synth
            fanfareSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "fatsawtooth", count: 3, spread: 20 },
                envelope: { attack: 0.02, decay: 0.3, sustain: 0.25, release: 0.8 }
            }).toDestination();
            fanfareSynth.volume.value = -12;

            synthsInitialized = true;
        }

        function playFloorSound(index) {
            if (!soundEnabled || !synthsInitialized) return;
            const notes = ["C4", "D4", "E4", "G4", "A4", "C5"];
            try {
                thudSynth.triggerAttackRelease("C2", "16n");
                popSynth.triggerAttackRelease(notes[index] || "C5", "16n", "+0.03");
            } catch (e) {}
        }

        function playVictoryFanfare() {
            if (!soundEnabled || !synthsInitialized) return;
            try {
                const now = Tone.now();
                fanfareSynth.triggerAttackRelease(["C4", "E4", "G4"], "16n", now);
                fanfareSynth.triggerAttackRelease(["E4", "G4", "C5"], "16n", now + 0.14);
                fanfareSynth.triggerAttackRelease(["G4", "C5", "E5", "G5"], "4n", now + 0.28);
            } catch (e) {}
        }

        // ============================================================================
        // 2. PARTICLE GENERATORS (Impact Sparks & Celebration Confetti)
        // ============================================================================
        const confettiContainer = document.getElementById('confettiContainer');
        const impactSparks = document.getElementById('impactSparks');
        const confettiPieces = [];
        const sparkPieces = [];

        // Pre-populate SVG confetti particles for smooth GSAP control
        function createConfettiPool() {
            const colors = ['#93c5fd', '#5eead4', '#86efac', '#fde047', '#fdba74', '#7dd3fc', '#cbd5e1'];
            for (let i = 0; i < 55; i++) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                const isCircle = i % 3 === 0;
                const el = isCircle
                    ? document.createElementNS("http://www.w3.org/2000/svg", "circle")
                    : rect;
                
                if (isCircle) {
                    el.setAttribute("r", gsap.utils.random(3.5, 6));
                } else {
                    el.setAttribute("width", gsap.utils.random(6, 11));
                    el.setAttribute("height", gsap.utils.random(4, 7));
                    el.setAttribute("rx", "1.5");
                }
                el.setAttribute("fill", colors[i % colors.length]);
                el.setAttribute("opacity", "0");
                confettiContainer.appendChild(el);
                confettiPieces.push(el);
            }

            // Create 12 reusable dust/spark circles for floor landings
            for (let i = 0; i < 12; i++) {
                const dust = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dust.setAttribute("r", gsap.utils.random(4, 8));
                dust.setAttribute("fill", "#f8fafc");
                dust.setAttribute("opacity", "0");
                impactSparks.appendChild(dust);
                sparkPieces.push(dust);
            }
        }

        function triggerLandingBurst(yPos) {
            sparkPieces.forEach((dot, idx) => {
                const isLeft = idx < 6;
                const startX = isLeft ? 280 : 520;
                const targetX = startX + (isLeft ? gsap.utils.random(-35, -10) : gsap.utils.random(10, 35));
                const targetY = yPos + gsap.utils.random(-15, 6);
                gsap.fromTo(dot, 
                    { attr: { cx: startX, cy: yPos }, opacity: 0.85, scale: 0.5 },
                    { attr: { cx: targetX, cy: targetY }, opacity: 0, scale: 1.5, duration: 0.38, ease: "power2.out" }
                );
            });
        }

        // ============================================================================
        // 3. GSAP AMBIENT ANIMATIONS & MASTER TIMELINE (7.5 SECONDS TOTAL)
        // ============================================================================
        // Continuous ambient loops (Crane banner gentle breeze sway, clouds, sun/moon pulse, star twinkle)
        gsap.to("#craneBannerCloth", { skewX: 1.8, rotation: 0.6, duration: 1.4, repeat: -1, yoyo: true, ease: "sine.inOut", transformOrigin: "top center" });
        gsap.to("#sunHalo", { scale: 1.15, opacity: 0.75, duration: 2, repeat: -1, yoyo: true, ease: "sine.inOut", transformOrigin: "center center" });
        gsap.to("#moonHalo", { scale: 1.12, opacity: 0.85, duration: 2.2, repeat: -1, yoyo: true, ease: "sine.inOut", transformOrigin: "center center" });
        gsap.to(".twinkle-star", { opacity: 0.25, scale: 0.75, duration: 0.9, repeat: -1, yoyo: true, ease: "sine.inOut", stagger: 0.12, transformOrigin: "center center" });
        gsap.to("#cloud1", { x: "+=45", duration: 12, repeat: -1, yoyo: true, ease: "sine.inOut" });
        gsap.to("#cloud2", { x: "-=35", duration: 10, repeat: -1, yoyo: true, ease: "sine.inOut" });

        // Floor configuration from bottom to top: S - E - R - O - H - C
        const floorSequence = [
            { id: "#floor-S", letter: "S", topY: 380, bottomY: 428 },
            { id: "#floor-E", letter: "E", topY: 332, bottomY: 380 },
            { id: "#floor-R", letter: "R", topY: 284, bottomY: 332 },
            { id: "#floor-O", letter: "O", topY: 236, bottomY: 284 },
            { id: "#floor-H", letter: "H", topY: 188, bottomY: 236 },
            { id: "#floor-C", letter: "C", topY: 140, bottomY: 188 }
        ];

        const scrubber = document.getElementById('timelineScrubber');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const playPauseIcon = document.getElementById('playPauseIcon');

        let isScrubbing = false;
        let shouldLoop = false;

        // Create Master Timeline (Strictly 7.5 seconds total)
        const masterTL = gsap.timeline({
            onUpdate: () => {
                const t = masterTL.time();
                const dur = masterTL.duration();
                if (!isScrubbing) {
                    scrubber.value = Math.round((t / dur) * 1000);
                }
                timeDisplay.textContent = `${t.toFixed(1)}s / ${dur.toFixed(1)}s`;
                updateChorePillsByTime(t);
            },
            onComplete: () => {
                if (shouldLoop) {
                    masterTL.restart();
                } else {
                    playPauseIcon.className = "ph-fill ph-play text-xl";
                }
            }
        });

        function buildChoreAnimationTimeline() {
            masterTL.clear();

            // --- INITIAL STATES (DAYTIME START) ---
            masterTL.set("#nightSkyRect", { opacity: 0 }, 0);
            masterTL.set("#starsGroup", { opacity: 0 }, 0);
            masterTL.set("#distantCityLights", { opacity: 0 }, 0);
            masterTL.set("#sunGroup", { x: 680, y: 95, opacity: 1, scale: 1 }, 0);
            masterTL.set("#moonGroup", { x: 680, y: 260, opacity: 0, scale: 0.85 }, 0);
            masterTL.set("#cloudsLayer", { opacity: 0.9 }, 0);
            masterTL.set("#hillBack", { fill: "#bbf7d0", opacity: 0.6 }, 0);
            masterTL.set("#hillFront", { fill: "#86efac", opacity: 0.55 }, 0);
            masterTL.set("#groundBase", { fill: "#cbd5e1" }, 0);
            masterTL.set("#groundRim", { fill: "#94a3b8" }, 0);
            masterTL.set("#cabinWindow", { fill: "#bae6fd" }, 0);
            masterTL.set("#roofBeacon", { fill: "#38bdf8" }, 0);
            masterTL.set("#roofBeaconGlow", { opacity: 0, scale: 0.5, transformOrigin: "center center" }, 0);

            // Keep the entire building dark and desaturated during construction
            masterTL.set("#buildingContainer", { "--bldg-bright": 0.16, "--bldg-sat": 0.15 }, 0);
            masterTL.set("#foundation", { scaleX: 0, opacity: 0, transformOrigin: "center bottom" }, 0);
            masterTL.set(".building-floor", { y: -320, opacity: 0, scaleX: 0.92, scaleY: 1.08, "--win-lit": 0, transformOrigin: "center bottom" }, 0);
            masterTL.set("#buildingRoof", { y: -220, opacity: 0, scale: 0.85, transformOrigin: "center bottom" }, 0);
            masterTL.set("#roofFlag", { scaleX: 0, transformOrigin: "left center" }, 0);
            masterTL.set("#craneSystem", { x: 0, opacity: 1 }, 0);
            masterTL.set("#craneTrolley", { x: 400 }, 0);
            masterTL.set("#craneCable", { attr: { y2: 55 } }, 0);
            masterTL.set("#craneHook", { y: 55 }, 0);
            masterTL.set("#slingCables", { opacity: 1 }, 0);
            masterTL.set("#craneBannerGroup", { opacity: 0 }, 0);
            masterTL.set("#craneBannerCloth", { scaleY: 0, transformOrigin: "top center" }, 0);
            masterTL.set(".crew-member .worker-body", { y: 0, rotation: 0, transformOrigin: "center bottom" }, 0);
            masterTL.set(".crew-member .arm-left", { rotation: 0 }, 0);
            masterTL.set(".crew-member .arm-right", { rotation: 0 }, 0);
            masterTL.set(".crew-member .hardhat", { y: 0, rotation: 0 }, 0);
            masterTL.set(confettiPieces, { opacity: 0, x: 400, y: 160, scale: 0 }, 0);

            // --- AMBIENT DAY-TO-NIGHT TRANSITION DURING CONSTRUCTION (1.1s -> 4.6s) ---
            // Sun gradually sets below the horizon
            masterTL.to("#sunGroup", {
                y: 280,
                opacity: 0,
                scale: 0.85,
                duration: 2.5,
                ease: "power1.inOut"
            }, 1.1);

            // Night sky gradient crossfades in
            masterTL.to("#nightSkyRect", {
                opacity: 1,
                duration: 2.8,
                ease: "sine.inOut"
            }, 1.4);

            // Stars and distant city lights appear as dusk settles
            masterTL.to("#starsGroup", {
                opacity: 1,
                duration: 2.0,
                ease: "sine.inOut"
            }, 2.3);

            masterTL.to("#distantCityLights", {
                opacity: 0.85,
                duration: 1.6,
                ease: "sine.inOut"
            }, 2.6);

            // Crescent moon rises into the night sky
            masterTL.to("#moonGroup", {
                y: 92,
                opacity: 1,
                scale: 1,
                duration: 2.2,
                ease: "back.out(1.2)"
            }, 2.3);

            // Clouds, hills, and ground shift to cool moonlight tones
            masterTL.to("#cloudsLayer", {
                opacity: 0.22,
                duration: 2.5,
                ease: "sine.inOut"
            }, 1.5);

            masterTL.to("#hillBack", {
                fill: "#1e293b",
                opacity: 0.75,
                duration: 2.6,
                ease: "sine.inOut"
            }, 1.5);

            masterTL.to("#hillFront", {
                fill: "#334155",
                opacity: 0.8,
                duration: 2.6,
                ease: "sine.inOut"
            }, 1.5);

            masterTL.to("#groundBase", {
                fill: "#475569",
                duration: 2.6,
                ease: "sine.inOut"
            }, 1.5);

            masterTL.to("#groundRim", {
                fill: "#334155",
                duration: 2.6,
                ease: "sine.inOut"
            }, 1.5);

            // Crane operator cabin light switches on at dusk
            masterTL.to("#cabinWindow", {
                fill: "#fde047",
                duration: 0.4,
                ease: "power2.out"
            }, 2.5);

            // --- PHASE 1: FOUNDATION & CREW PREP (0.0s -> 0.45s) ---
            masterTL.to("#foundation", {
                scaleX: 1,
                opacity: 1,
                duration: 0.4,
                ease: "back.out(1.7)"
            }, 0.05);

            // Subtle working motion for the crew during construction (0.2s -> 4.6s)
            masterTL.to(".crew-member .worker-body", {
                y: -3,
                duration: 0.22,
                repeat: 19,
                yoyo: true,
                ease: "sine.inOut",
                stagger: 0.05
            }, 0.2);

            // --- PHASE 2: STACKING FLOORS S - E - R - O - H - C (0.45s -> 4.65s) ---
            // Each floor takes ~0.68s with slight overlap so all 6 complete briskly by 4.65s
            const startOffset = 0.45;
            const stepInterval = 0.68;

            floorSequence.forEach((floor, index) => {
                const tStart = startOffset + index * stepInterval;
                const hookStopY = floor.topY - 88; // Position where crane hook releases floor

                // 1. Crane hook drops down with floor module
                masterTL.fromTo("#craneCable",
                    { attr: { y2: 45 } },
                    { attr: { y2: hookStopY }, duration: 0.36, ease: "power2.out" },
                    tStart
                );
                masterTL.fromTo("#craneHook",
                    { y: 45 },
                    { y: hookStopY, duration: 0.36, ease: "power2.out" },
                    tStart
                );

                // 2. Floor descends into place
                masterTL.to(floor.id, {
                    y: 0,
                    opacity: 1,
                    scaleX: 1,
                    scaleY: 1,
                    duration: 0.38,
                    ease: "power3.in",
                    onComplete: () => {
                        playFloorSound(index);
                        triggerLandingBurst(floor.bottomY);
                    }
                }, tStart);

                // 3. Satisfying Squash & Stretch bounce upon landing
                masterTL.to(floor.id, {
                    scaleX: 1.06,
                    scaleY: 0.90,
                    duration: 0.09,
                    ease: "power1.out"
                }, tStart + 0.38);

                masterTL.to(floor.id, {
                    scaleX: 1,
                    scaleY: 1,
                    duration: 0.2,
                    ease: "elastic.out(1.2, 0.4)"
                }, tStart + 0.47);

                // 4. Retract crane cable slightly for next floor
                masterTL.to("#craneCable", {
                    attr: { y2: 45 },
                    duration: 0.22,
                    ease: "power1.inOut"
                }, tStart + 0.42);
                masterTL.to("#craneHook", {
                    y: 45,
                    duration: 0.22,
                    ease: "power1.inOut"
                }, tStart + 0.42);
            });

            // --- PHASE 3: ROOF CAP & CRANE CLEARANCE (4.65s -> 5.25s) ---
            const roofTime = 4.65;
            masterTL.to("#slingCables", { opacity: 0, duration: 0.15 }, roofTime);

            masterTL.to("#buildingRoof", {
                y: 0,
                opacity: 1,
                scale: 1,
                duration: 0.38,
                ease: "back.out(1.6)",
                onComplete: () => playVictoryFanfare()
            }, roofTime);

            // Once the entire building + roof cap is complete at night (~4.97s), the whole building flickers and turns bright!
            const powerOnBaseTime = roofTime + 0.32;
            masterTL.to("#buildingContainer", { "--bldg-bright": 0.85, "--bldg-sat": 0.85, duration: 0.05, ease: "none" }, powerOnBaseTime);
            masterTL.to("#buildingContainer", { "--bldg-bright": 0.22, "--bldg-sat": 0.2, duration: 0.05, ease: "none" }, powerOnBaseTime + 0.05);
            masterTL.to("#buildingContainer", { "--bldg-bright": 1.0, "--bldg-sat": 1.0, duration: 0.06, ease: "none" }, powerOnBaseTime + 0.10);
            masterTL.to("#buildingContainer", { "--bldg-bright": 0.35, "--bldg-sat": 0.4, duration: 0.05, ease: "none" }, powerOnBaseTime + 0.16);
            masterTL.to("#buildingContainer", { "--bldg-bright": 1.08, "--bldg-sat": 1.05, duration: 0.28, ease: "power2.out" }, powerOnBaseTime + 0.21);

            floorSequence.forEach((floor, index) => {
                const fTime = powerOnBaseTime + index * 0.04;
                // Quick electrical fluorescent flicker before staying warmly lit
                masterTL.to(floor.id, { "--win-lit": 0.85, duration: 0.04, ease: "none" }, fTime);
                masterTL.to(floor.id, { "--win-lit": 0.15, duration: 0.04, ease: "none" }, fTime + 0.04);
                masterTL.to(floor.id, { "--win-lit": 1, duration: 0.05, ease: "none" }, fTime + 0.08);
                masterTL.to(floor.id, { "--win-lit": 0.35, duration: 0.04, ease: "none" }, fTime + 0.13);
                masterTL.to(floor.id, { "--win-lit": 1, duration: 0.18, ease: "power2.out" }, fTime + 0.17);
            });

            // Illuminate rooftop beacon in the night sky
            masterTL.to("#roofBeacon", {
                fill: "#fde047",
                duration: 0.25
            }, roofTime + 0.32);

            masterTL.to("#roofBeaconGlow", {
                opacity: 0.85,
                scale: 1.3,
                duration: 0.4,
                yoyo: true,
                repeat: 5,
                ease: "sine.inOut"
            }, roofTime + 0.32);

            // Unfurl rooftop completion flag
            masterTL.to("#roofFlag", {
                scaleX: 1,
                duration: 0.3,
                ease: "back.out(2)"
            }, roofTime + 0.3);

            // Retract crane trolley back to mast and hoist hook up so the jib is clear for the banner
            masterTL.to("#craneTrolley", {
                x: 185,
                duration: 0.6,
                ease: "power2.inOut"
            }, roofTime + 0.08);
            masterTL.to("#craneCable", {
                attr: { y2: 20 },
                duration: 0.4,
                ease: "power2.out"
            }, roofTime + 0.08);
            masterTL.to("#craneHook", {
                y: 20,
                duration: 0.4,
                ease: "power2.out"
            }, roofTime + 0.08);

            // Whole building does a proud subtle victory pop
            masterTL.fromTo("#buildingContainer",
                { scale: 1, transformOrigin: "400px 445px" },
                { scale: 1.03, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" },
                roofTime + 0.35
            );

            // --- PHASE 4: CRANE BANNER UNFURL & CREW CELEBRATION (4.95s -> 7.5s) ---
            const celebrateTime = 4.95;

            // "CHORES COMPLETED" banner drops and unfurls from the crane's horizontal jib arm
            masterTL.to("#craneBannerGroup", {
                opacity: 1,
                duration: 0.15
            }, celebrateTime - 0.05);

            masterTL.fromTo("#craneBannerCloth",
                { scaleY: 0 },
                {
                    scaleY: 1,
                    duration: 0.65,
                    ease: "elastic.out(1.15, 0.45)"
                },
                celebrateTime
            );

            // Construction Crew Celebration: Arms raised high + joyful jumping + hardhat toss!
            masterTL.to(".crew-member .arm-left", {
                rotation: 135,
                duration: 0.25,
                ease: "back.out(2)"
            }, celebrateTime);

            masterTL.to(".crew-member .arm-right", {
                rotation: -135,
                duration: 0.25,
                ease: "back.out(2)"
            }, celebrateTime);

            // Crew jumps repeatedly in celebration
            const crewNodes = gsap.utils.toArray(".crew-member .worker-body");
            crewNodes.forEach((worker, i) => {
                masterTL.to(worker, {
                    y: -22,
                    duration: 0.26,
                    repeat: 7,
                    yoyo: true,
                    ease: "power1.out"
                }, celebrateTime + (i * 0.07));
            });

            // Hardhats pop up in excitement on jumps
            masterTL.to(".crew-member .hardhat", {
                y: -8,
                rotation: (i) => (i % 2 === 0 ? -12 : 12),
                duration: 0.26,
                repeat: 7,
                yoyo: true,
                ease: "power1.out"
            }, celebrateTime + 0.05);

            // Confetti Explosion from rooftop
            confettiPieces.forEach((piece, i) => {
                const angle = gsap.utils.random(-160, -20) * (Math.PI / 180);
                const velocity = gsap.utils.random(90, 260);
                const spreadX = 400 + Math.cos(angle) * velocity + gsap.utils.random(-60, 60);
                const peakY = 130 + Math.sin(angle) * (velocity * 0.65);
                const finalY = gsap.utils.random(360, 465);

                masterTL.fromTo(piece,
                    { x: 400, y: 135, scale: 0, opacity: 1, rotation: 0 },
                    {
                        x: spreadX,
                        y: peakY,
                        scale: 1,
                        rotation: gsap.utils.random(-180, 180),
                        duration: 0.55,
                        ease: "power2.out"
                    },
                    celebrateTime + 0.05 + (i * 0.008)
                );

                masterTL.to(piece, {
                    y: finalY,
                    x: `+=${gsap.utils.random(-35, 35)}`,
                    rotation: `+=${gsap.utils.random(180, 360)}`,
                    opacity: 0,
                    duration: 1.65,
                    ease: "power1.in"
                }, celebrateTime + 0.6 + (i * 0.008));
            });
        }

        // Update Status Badge based on current timeline timestamp
        function updateChorePillsByTime(time) {
            const startOffset = 0.45;
            const stepInterval = 0.68;

            if (time >= 4.95) {
                statusText.textContent = "CHORES COMPLETED";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
                statusText.parentElement.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-700";
            } else {
                const completedCount = floorSequence.filter((_, idx) => time >= (startOffset + idx * stepInterval + 0.36)).length;
                statusText.textContent = `Building Floor ${Math.min(completedCount + 1, 6)} of 6...`;
                statusDot.className = "w-2 h-2 rounded-full bg-sky-500 animate-pulse";
                statusText.parentElement.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-700";
            }
        }

        // ============================================================================
        // 4. INTERACTIVE CONTROLS & EVENT LISTENERS
        // ============================================================================
        buildChoreAnimationTimeline();

        const seekParam = urlParams.get("seek");
        if (seekParam !== null) {
            masterTL.pause();
            masterTL.seek(parseFloat(seekParam));
        }


        const playPauseBtn = document.getElementById('playPauseBtn');
        const replayBtn = document.getElementById('replayBtn');
        const speedBtn = document.getElementById('speedBtn');
        const loopBtn = document.getElementById('loopBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundLabel = document.getElementById('soundLabel');

        playPauseBtn.addEventListener('click', () => {
            if (masterTL.progress() === 1) {
                masterTL.restart();
                playPauseIcon.className = "ph-fill ph-pause text-xl";
            } else if (masterTL.paused()) {
                masterTL.play();
                playPauseIcon.className = "ph-fill ph-pause text-xl";
            } else {
                masterTL.pause();
                playPauseIcon.className = "ph-fill ph-play text-xl";
            }
        });

        replayBtn.addEventListener('click', () => {
            masterTL.restart();
            playPauseIcon.className = "ph-fill ph-pause text-xl";
        });

        // Scrubber interaction
        scrubber.addEventListener('input', (e) => {
            isScrubbing = true;
            const progress = parseFloat(e.target.value) / 1000;
            masterTL.pause();
            masterTL.progress(progress);
            playPauseIcon.className = "ph-fill ph-play text-xl";
        });

        scrubber.addEventListener('change', () => {
            isScrubbing = false;
        });

        // Playback speed toggle (1.0x -> 1.5x -> 0.5x)
        const speeds = [1.0, 1.5, 0.5];
        let speedIdx = 0;
        speedBtn.addEventListener('click', () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            const newSpeed = speeds[speedIdx];
            masterTL.timeScale(newSpeed);
            speedBtn.textContent = `${newSpeed.toFixed(1)}x`;
        });

        // Loop toggle
        loopBtn.addEventListener('click', () => {
            shouldLoop = !shouldLoop;
            loopBtn.querySelector('span').textContent = `Loop: ${shouldLoop ? 'On' : 'Off'}`;
            loopBtn.classList.toggle('text-sky-600', shouldLoop);
            loopBtn.classList.toggle('border-sky-300', shouldLoop);
        });

        // Synthesized Sound toggle
        soundBtn.addEventListener('click', async () => {
            await initAudio();
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "ph-fill ph-speaker-high text-base text-sky-600";
                soundLabel.textContent = "SFX On";
                soundBtn.classList.add("border-sky-300");
            } else {
                soundIcon.className = "ph-fill ph-speaker-slash text-base text-slate-400";
                soundLabel.textContent = "SFX Off";
                soundBtn.classList.remove("border-sky-300");
            }
        });

        // Audio Initialization
        const isSoundExplicitlyAllowed = urlParams.get("sound") === "1" || (urlParams.get("sound") !== "0" && localStorage.getItem("nivas_celebration_sound") === "true");
        try {
            if (isSoundExplicitlyAllowed) {
                initAudio().then(() => {
                    soundEnabled = true;
                    if (soundIcon && soundLabel) {
                        soundIcon.className = "ph-fill ph-speaker-high text-base text-sky-600";
                        soundLabel.textContent = "SFX On";
                        soundBtn?.classList.add("border-sky-300");
                    }
                }).catch(() => {});
            }
        } catch (e) {}

        window.addEventListener("click", async () => {
            if (!synthsInitialized && isSoundExplicitlyAllowed) {
                await initAudio().catch(() => {});
                soundEnabled = true;
            }
        }, { once: true });

        window.addEventListener("pagehide", () => {
            masterTL.pause();
            try { Tone.Transport.stop(); } catch (e) {}
        });
    </script>
</body>
</html>
