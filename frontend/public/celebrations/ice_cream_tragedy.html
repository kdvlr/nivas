<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Cream Tragedy · Chore Penalty Celebration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #f43f5e;
      --primary-dark: #be123c;
      --surface: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.92);
      --border-glow: rgba(244, 63, 94, 0.5);
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0f172a;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Standalone Container Frame */
    .app-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stage-container {
      width: min(100vw, 1200px);
      aspect-ratio: 16 / 9;
      max-height: 90vh;
      background: radial-gradient(circle at 50% 20%, #38bdf8 0%, #0284c7 40%, #0369a1 70%, #0f172a 100%);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(244, 63, 94, 0.25);
      position: relative;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Standalone Control Bar */
    .controls-bar {
      position: absolute;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 9999px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .controls-bar button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls-bar button:hover {
      background: rgba(244, 63, 94, 0.25);
      border-color: #f43f5e;
      color: #fecdd3;
      transform: translateY(-1px);
    }

    .controls-bar button.primary {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-color: #fb7185;
      color: #fff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
    }

    .controls-bar .points-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 700;
      font-family: 'Fredoka', cursive;
    }

    .controls-bar input[type="number"] {
      width: 50px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      color: #f43f5e;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      padding: 3px 0;
      outline: none;
    }

    /* Embed Mode (Inside Celebration Modal / Fullscreen) */
    body.embed {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    body.embed .controls-bar {
      display: none !important;
    }

    body.embed .stage-container {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>

          <!-- Top Red Alert Pill Badge -->
          <g transform="translate(0, -70)">
            <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#be123c" stroke="#f43f5e" stroke-width="2" />

          <!-- MAIN PROMPT INSTRUCTION TITLE: "Removed x points from your account" -->
          <text id="bannerTitle" x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
            Removed 10 points from your account
          </text>

          <!-- Points Lost Badge Pill with Broken Coin Icon -->
          <g transform="translate(0, 42)">
            <rect x="-160" y="-16" width="320" height="34" rx="17" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1.8" />
            <text id="bannerSubtitle" x="0" y="7" text-anchor="middle" fill="#fda4af" font-family="'Fredoka', cursive" font-weight="700" font-size="16">
              −10 🪙 💔  Clean up next time to get them back!

    <!-- Standalone Controls (Auto-hidden in embed mode) -->
    <div class="controls-bar">
      <div class="points-input-group">
        <label for="pointsInput">Penalty:</label>
        <input type="number" id="pointsInput" value="10" min="1" max="100" />
        <span>pts</span>
      </div>
      <button id="soundBtn">🔊 Sound: ON</button>
      <button id="replayBtn" class="primary">↻ Replay</button>
    </div>
  </div>

  <script>
    'use strict';

    // -------------------------------------------------------------------------
    // PARAMS & SETTINGS
    // -------------------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const isEmbed = urlParams.has('embed') || window.location.hash.includes('embed');
    if (isEmbed) document.body.classList.add('embed');

    let choreTitle = urlParams.get('title') || 'Room Not Clean';
    let pointsLost = Math.abs(parseInt(urlParams.get('points'), 10) || 10);
    let soundEnabled = urlParams.get('sound') !== '0' && localStorage.getItem('nivas_celebration_sound') !== 'false';

    const pointsInput = document.getElementById('pointsInput');
    if (pointsInput) {
      pointsInput.value = pointsLost;
      pointsInput.addEventListener('change', (e) => {
        pointsLost = Math.max(1, Math.abs(parseInt(e.target.value, 10) || 10));
        updateBannerText();
      });
    }

    const soundBtn = document.getElementById('soundBtn');
    if (soundBtn) {
      soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        localStorage.setItem('nivas_celebration_sound', soundEnabled ? 'true' : 'false');
      });
    }

    // -------------------------------------------------------------------------
    // PROCEDURAL WEB AUDIO SYNTHESIZER
    // -------------------------------------------------------------------------
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && typeof window !== 'undefined') {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, type, start, dur, startGain = 0.2, endGain = 0.001) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(startGain, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(endGain, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }

    function playSlideWhistle(startFreq, endFreq, start, dur) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(startFreq, ctx.currentTime + start);
      osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + start + dur);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    }

    function playWetSplat(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      // Low punchy impact
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, ctx.currentTime + start);
      osc.frequency.exponentialRampToValueAtTime(38, ctx.currentTime + start + 0.22);
      gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 0.3);

      // Squish high pop
      const pop = ctx.createOscillator();
      const popGain = ctx.createGain();
      pop.type = 'sine';
      pop.frequency.setValueAtTime(450, ctx.currentTime + start);
      pop.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + start + 0.14);
      popGain.gain.setValueAtTime(0.3, ctx.currentTime + start);
      popGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.18);
      pop.connect(popGain);
      popGain.connect(ctx.destination);
      pop.start(ctx.currentTime + start);
      pop.stop(ctx.currentTime + start + 0.2);
    }

    function playWahWahCrying(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      // Classic cartoon crying descending wah-wah notes
      const notes = [
        { f: 392, d: 0.32, bend: null },
        { f: 369, d: 0.32, bend: null },
        { f: 349, d: 0.35, bend: null },
        { f: 329, d: 1.25, bend: 261 }, // F4 to C4 slide
      ];
      let offset = start;
      notes.forEach((n) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, ctx.currentTime + offset);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(n.f, ctx.currentTime + offset);
        if (n.bend) {
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + offset + 0.3);
          osc.frequency.exponentialRampToValueAtTime(n.bend, ctx.currentTime + offset + n.d);
        }

        gain.gain.setValueAtTime(0, ctx.currentTime + offset);
        gain.gain.linearRampToValueAtTime(0.24, ctx.currentTime + offset + 0.04);
        gain.gain.setValueAtTime(0.22, ctx.currentTime + offset + n.d - 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + n.d);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + n.d + 0.05);

        offset += n.d + 0.06;
      });
    }

    function playBirdYoink(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      // Flutter swoosh
      playSlideWhistle(1200, 3200, start, 0.25);
      // Cheeky gull chirp
      playTone(2800, 'triangle', start + 0.22, 0.12, 0.25);
      // Pop as cone is snatched
      playTone(650, 'sine', start + 0.28, 0.09, 0.35);
    }

    function playPenaltyGong(start) {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(146.83, ctx.currentTime + start); // D3
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 1.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 1.9);
    }

    // -------------------------------------------------------------------------
    // ANIMATION ENGINE & TIMELINE
    // -------------------------------------------------------------------------
    const DURATION = 7.2; // total seconds

    const scene = document.getElementById('scene');
    const moodOverlay = document.getElementById('moodOverlay');
    const kidCharacter = document.getElementById('kidCharacter');
    const kidHead = document.getElementById('kidHead');
    const faceHappy = document.getElementById('faceHappy');
    const faceShocked = document.getElementById('faceShocked');
    const faceCrying = document.getElementById('faceCrying');
    const armsHappy = document.getElementById('armsHappy');
    const armsDespair = document.getElementById('armsDespair');
    const waffleConeGroup = document.getElementById('waffleConeGroup');
    const scoopTower = document.getElementById('scoopTower');
    const splatGroup = document.getElementById('splatGroup');
    const splatShockwave = document.getElementById('splatShockwave');
    const splatDroplets = document.getElementById('splatDroplets');
    const personalCloud = document.getElementById('personalCloud');
    const seagullBird = document.getElementById('seagullBird');
    const seagullWingLeft = document.getElementById('seagullWingLeft');
    const stolenConeInBeak = document.getElementById('stolenConeInBeak');
    const penaltyBanner = document.getElementById('penaltyBanner');
    const bannerTitle = document.getElementById('bannerTitle');
    const bannerSubtitle = document.getElementById('bannerSubtitle');
    const bannerChoreTag = document.getElementById('bannerChoreTag');
    const tearFountainLayer = document.getElementById('tearFountainLayer');

    function updateBannerText() {
      bannerTitle.textContent = `Removed ${pointsLost} points from your account`;
      bannerSubtitle.textContent = `−${pointsLost} 🪙 💔   Clean up next time to get them back!`;
      bannerChoreTag.textContent = `⚠️ ${choreTitle.toUpperCase()}`;
    }
    updateBannerText();

    let startTime = null;
    let animFrame = null;
    let audioScheduled = false;

    // Particle systems
    const tearPool = [];
    for (let i = 0; i < 60; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '4');
      circle.setAttribute('fill', '#38bdf8');
      circle.setAttribute('opacity', '0');
      tearFountainLayer.appendChild(circle);
      tearPool.push({ el: circle, active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 });
    }

    const dropletPool = [];
    for (let i = 0; i < 24; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', (Math.random() * 4 + 3).toString());
      circle.setAttribute('fill', Math.random() < 0.6 ? '#f43f5e' : (Math.random() < 0.5 ? '#10b981' : '#fde047'));
      circle.setAttribute('opacity', '0');
      splatDroplets.appendChild(circle);
      dropletPool.push({ el: circle, active: false, x: 0, y: 0, vx: 0, vy: 0 });
    }

    function triggerAudioTimeline() {
      if (audioScheduled) return;
      audioScheduled = true;
      // 1. Cheerful lick notes
      playTone(523.25, 'sine', 0.2, 0.25, 0.18); // C5
      playTone(659.25, 'sine', 0.55, 0.25, 0.18); // E5
      playTone(783.99, 'sine', 0.9, 0.25, 0.18); // G5
      // 2. Slip whistle
      playSlideWhistle(850, 240, 1.7, 0.45);
      // 3. Splat!
      setTimeout(() => playWetSplat(0), 2250);
      // 4. Wah wah crying
      setTimeout(() => playWahWahCrying(0), 2600);
      // 5. Bird swoop & yoink
      setTimeout(() => playBirdYoink(0), 4050);
      // 6. Penalty gong
      setTimeout(() => playPenaltyGong(0), 4950);
    }

    function render(t) {
      // ---------------------------------------------------------
      // ACT 1: PURE BLISS (t: 0.0s to 1.7s)
      // ---------------------------------------------------------
      if (t < 1.7) {
        // Kid happily bobbing
        const bounce = Math.sin(t * 8) * 8;
        kidCharacter.setAttribute('transform', `translate(600, ${360 + bounce})`);
        kidHead.setAttribute('transform', `translate(0, ${Math.sin(t * 8) * 2}) rotate(${Math.sin(t * 4) * 4})`);

        // Face is happy
        faceHappy.setAttribute('opacity', '1');
        faceShocked.setAttribute('opacity', '0');
        faceCrying.setAttribute('opacity', '0');
        armsHappy.setAttribute('opacity', '1');
        armsDespair.setAttribute('opacity', '0');

        // Tongue licks out toward the ice cream
        const tongueWiggle = Math.sin(t * 14) * 4;
        const lickingTongue = document.getElementById('lickingTongue');
        if (lickingTongue) lickingTongue.setAttribute('transform', `translate(${tongueWiggle}, 0)`);

        // Cone is held comfortably in hand
        waffleConeGroup.setAttribute('transform', `translate(630, ${410 + bounce}) rotate(-8)`);
        scoopTower.setAttribute('transform', 'translate(0, 0)');
        splatGroup.setAttribute('opacity', '0');
        personalCloud.setAttribute('opacity', '0');
        seagullBird.setAttribute('opacity', '0');
        penaltyBanner.setAttribute('opacity', '0');
        moodOverlay.setAttribute('opacity', '0');
      }

      // ---------------------------------------------------------
      // ACT 2: THE SLIP & CALAMITY (t: 1.7s to 2.25s)
      // ---------------------------------------------------------
      else if (t >= 1.7 && t < 2.25) {
        const dropT = t - 1.7; // 0 to 0.55s

        // Kid freezes in horror
        kidCharacter.setAttribute('transform', 'translate(600, 360)');
        kidHead.setAttribute('transform', 'translate(0, -4) scale(1.05)');

        // Face switches to SHOCKED
        faceHappy.setAttribute('opacity', '0');
        faceShocked.setAttribute('opacity', '1');
        faceCrying.setAttribute('opacity', '0');

        // Waffle cone tilts forward slightly
        waffleConeGroup.setAttribute('transform', 'translate(635, 412) rotate(14)');

        // SCOOP FALLS OFF!
        if (dropT < 0.15) {
          // Wobble on cone lip
          const wobble = Math.sin(dropT * 40) * 12;
          scoopTower.setAttribute('transform', `translate(${wobble}, ${dropT * 30}) rotate(${wobble * 1.5})`);
        } else {
          // Parabolic fall to ground
          const fallTime = dropT - 0.15; // 0 to 0.4s
          const fallY = 0.5 * 2400 * fallTime * fallTime; // drops ~190px
          const fallX = fallTime * 140;
          const fallRot = fallTime * 180;
          scoopTower.setAttribute('transform', `translate(${fallX}, ${fallY}) rotate(${fallRot})`);
        }

        splatGroup.setAttribute('opacity', '0');
      }

      // ---------------------------------------------------------
      // ACT 3: SPLAT & WIDE-ARMED CRYING (t: 2.25s to 4.0s)
      // ---------------------------------------------------------
      else if (t >= 2.25 && t < 4.0) {
        const cryT = t - 2.25;

        // Splat hits ground!
        scoopTower.setAttribute('transform', 'translate(0, 9999)'); // hide original scoop tower
        splatGroup.setAttribute('opacity', '1');

        // Splat shockwave expands once
        if (cryT < 0.4) {
          const swScale = cryT / 0.4;
          splatShockwave.setAttribute('r', (swScale * 75).toString());
          splatShockwave.setAttribute('opacity', (1 - swScale).toString());
        } else {
          splatShockwave.setAttribute('opacity', '0');
        }

        // Spawn flying splat droplets
        if (cryT < 0.5) {
          dropletPool.forEach((d, idx) => {
            if (!d.active) {
              d.active = true;
              d.x = 710;
              d.y = 535;
              const ang = (Math.PI * 2 * idx) / dropletPool.length + (Math.random() - 0.5) * 0.4;
              const spd = Math.random() * 220 + 80;
              d.vx = Math.cos(ang) * spd;
              d.vy = Math.sin(ang) * spd * 0.5 - 120;
            }
            d.x += d.vx * 0.016;
            d.y += d.vy * 0.016;
            d.vy += 800 * 0.016; // gravity
            if (d.y > 540) d.y = 540;
            d.el.setAttribute('cx', d.x.toString());
            d.el.setAttribute('cy', d.y.toString());
            d.el.setAttribute('opacity', '1');
          });
        }

        // Kid shakes and trembles with wide-spread arms in agony
        const cryShake = Math.sin(t * 36) * 3;
        kidCharacter.setAttribute('transform', `translate(${600 + cryShake}, ${360 + Math.abs(cryShake)})`);

        // Face is CRYING with tear fountains
        faceHappy.setAttribute('opacity', '0');
        faceShocked.setAttribute('opacity', '0');
        faceCrying.setAttribute('opacity', '1');

        // Arms are FLUNG WIDE OPEN in despair
        armsHappy.setAttribute('opacity', '0');
        armsDespair.setAttribute('opacity', '1');

        // Left hand holds the empty waffle cone out to the left
        waffleConeGroup.setAttribute('transform', `translate(${465 + cryShake}, ${428 + cryShake}) rotate(25)`);

        // TEAR FOUNTAIN PARTICLES EMITTING FROM EYES!
        tearPool.forEach((p, idx) => {
          if (!p.active && Math.random() < 0.28) {
            p.active = true;
            const isLeft = idx % 2 === 0;
            p.x = isLeft ? 576 : 624;
            p.y = 350;
            p.vx = isLeft ? -(Math.random() * 160 + 120) : (Math.random() * 160 + 120);
            p.vy = -(Math.random() * 220 + 180);
            p.life = 1.0;
          }
          if (p.active) {
            p.x += p.vx * 0.016;
            p.y += p.vy * 0.016;
            p.vy += 950 * 0.016; // gravity
            p.life -= 0.018;
            if (p.y > 540 || p.life <= 0) {
              p.active = false;
              p.el.setAttribute('opacity', '0');
            } else {
              p.el.setAttribute('cx', p.x.toString());
              p.el.setAttribute('cy', p.y.toString());
              p.el.setAttribute('opacity', p.life.toString());
            }
          }
        });

        // Mood darkens slightly
        moodOverlay.setAttribute('opacity', (Math.min(0.4, cryT * 0.35)).toString());

        // Personal rain cloud appears over kid!
        personalCloud.setAttribute('opacity', (Math.min(1, cryT * 2)).toString());
        personalCloud.setAttribute('transform', `translate(600, ${180 + Math.sin(t * 4) * 6})`);
      }

      // ---------------------------------------------------------
      // ACT 4: THE SEAGULL SWOOP & CONE HEIST (t: 4.0s to 5.1s)
      // ---------------------------------------------------------
      else if (t >= 4.0 && t < 5.1) {
        const birdT = (t - 4.0) / 1.1; // 0 to 1
        seagullBird.setAttribute('opacity', '1');

        // Bird flapping
        const flapAngle = Math.sin(t * 32) * 28;
        seagullWingLeft.setAttribute('transform', `rotate(${flapAngle})`);

        // Bird Swoop Bezier Path:
        // Starts: (1250, 100) -> Dives to hand (465, 428) at birdT = 0.32 -> Swoops away to (-150, 80)
        let bx, by;
        if (birdT < 0.32) {
          // Diving toward hand
          const p = birdT / 0.32;
          bx = 1250 + (465 - 1250) * p;
          by = 100 + (428 - 100) * Math.pow(p, 1.4);
          seagullBird.setAttribute('transform', `translate(${bx}, ${by}) rotate(25)`);
          waffleConeGroup.setAttribute('opacity', '1');
          stolenConeInBeak.setAttribute('opacity', '0');
        } else {
          // Cone YOINKED! Bird flies up & away carrying the cone in beak
          const p = (birdT - 0.32) / 0.68;
          bx = 465 + (-160 - 465) * p;
          by = 428 + (60 - 428) * Math.pow(p, 0.75) - Math.sin(p * Math.PI) * 50;
          seagullBird.setAttribute('transform', `translate(${bx}, ${by}) rotate(-18) scale(0.95)`);

          // Kid's hand is now EMPTY!
          waffleConeGroup.setAttribute('opacity', '0');
          stolenConeInBeak.setAttribute('opacity', '1');

          // Kid stops crying and stares up in pure dumbfounded shock
          faceHappy.setAttribute('opacity', '0');
          faceShocked.setAttribute('opacity', '1');
          faceCrying.setAttribute('opacity', '0');
          // Hide tears
          tearPool.forEach(p => p.el.setAttribute('opacity', '0'));
        }
      }

      // ---------------------------------------------------------
      // ACT 5 & 6: TOTAL DEFEAT & PENALTY BANNER (t: 5.1s to 7.2s)
      // ---------------------------------------------------------
      else if (t >= 5.1) {
        const endT = t - 5.1;
        seagullBird.setAttribute('opacity', '0'); // bird has flown off screen

        // Kid slumps down onto knees in defeat
        kidCharacter.setAttribute('transform', 'translate(600, 395) scale(0.95, 0.9)');
        kidHead.setAttribute('transform', 'translate(0, 16) rotate(12)');
        faceCrying.setAttribute('opacity', '1');
        faceShocked.setAttribute('opacity', '0');

        // Personal storm cloud rains over slumped kid
        personalCloud.setAttribute('opacity', '0.9');

        // PENALTY BANNER DROPS FROM SKY WITH JUICY SPRING BOUNCE!
        penaltyBanner.setAttribute('opacity', '1');
        const springT = Math.min(1, endT / 0.6);
        // Elastic overshoot formula
        const springY = -180 + (220 - (-180)) * (1 - Math.cos(springT * Math.PI * 0.5) * Math.cos(springT * Math.PI * 2.5) * Math.exp(-springT * 3));
        const finalY = springT >= 0.9 ? 220 : springY;
        penaltyBanner.setAttribute('transform', `translate(600, ${finalY})`);
      }
    }

    // ---------------------------------------------------------
    // ANIMATION LOOP RUNNER
    // ---------------------------------------------------------
    function tick(now) {
      if (!startTime) startTime = now;
      const elapsed = (now - startTime) / 1000;

      // Start sound sequence right at start
      if (elapsed > 0.05 && !audioScheduled) {
        triggerAudioTimeline();
      }

      if (elapsed <= DURATION) {
        render(elapsed);
        animFrame = requestAnimationFrame(tick);
      } else {
        // Hold final frame
        render(DURATION);
      }
    }

    function startAnimation() {
      if (animFrame) cancelAnimationFrame(animFrame);
      startTime = null;
      audioScheduled = false;
      tearPool.forEach(p => { p.active = false; p.el.setAttribute('opacity', '0'); });
      dropletPool.forEach(d => { d.active = false; d.el.setAttribute('opacity', '0'); });
      render(0);
      animFrame = requestAnimationFrame(tick);
    }

    // Auto-start on load
    window.addEventListener('load', () => {
      startAnimation();
    });

    const replayBtn = document.getElementById('replayBtn');
    if (replayBtn) {
      replayBtn.addEventListener('click', () => {
        startAnimation();
      });
    }

    // Allow clicking anywhere to replay in standalone mode
    if (!isEmbed) {
      scene.addEventListener('click', () => {
        startAnimation();
      });
    }
  </script>
</body>
</html>
