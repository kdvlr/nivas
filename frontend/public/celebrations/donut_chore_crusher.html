<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut Chore Crusher · Sprinkled with success</title><style>

</style></head><body><main><header><div><div class="eyebrow">A little celebration · Sweet victory</div><h1>Donut Chore Crusher</h1></div><div class="badge">A whole lot of sweet determination.</div></header><div class="stage"><svg id="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="scene-title scene-desc"></svg></div><footer><p>Roll through. Sprinkle on the celebration.</p><div class="buttons"><button id="pause" aria-label="Pause animation">Pause</button><button id="replay" class="primary">↻ Replay</button></div></footer><p id="announcement" class="sr" role="status" aria-live="polite"></p></main><script>
'use strict';
const clamp=x=>Math.max(0,Math.min(1,x)),phase=(t,a,b)=>clamp((t-a)/(b-a)),ease=x=>1-Math.pow(1-clamp(x),3),mix=(a,b,p)=>a+(b-a)*p;
const palettes={strawberry:{accent:'#d3a5cd',dark:'#b88fbd',soft:'#ecd9ef'},blueberry:{accent:'#a89bd5',dark:'#7967ad',soft:'#e5def7'},mint:{accent:'#82baa6',dark:'#478c76',soft:'#cef0df'}};
const check=(x,y,s=1,color='#fff')=>`<path d="M ${x-10*s} ${y} l ${7*s} ${8*s} l ${15*s} ${-19*s}" fill="none" stroke="${color}" stroke-width="${5*s}" stroke-linecap="round" stroke-linejoin="round"/>`;
const star=(x,y,s,c)=>`<path d="M0 -14 Q3 -3 14 0 Q3 3 0 14 Q-3 3 -14 0 Q-3 -3 0 -14" transform="translate(${x} ${y}) scale(${s})" fill="${c}"/>`;
const scenes={
'donut-chore-crusher':{
 duration:9,
 description:'Chores do-nut stand a chance! A giant pink donut rolls over two big symbol checklists, bumps into the sprinkle shop, and rolls back covered in colorful sprinkles beneath a celebration banner.',
 mount(svg){svg.innerHTML=`<title id="scene-title">Donut Chore Crusher</title><desc id="scene-desc">${this.description}</desc>
 <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f4dce8"/><stop offset="1" stop-color="#fff0d8"/></linearGradient><linearGradient id="dough" x2="1" y2="1"><stop stop-color="#efc17c"/><stop offset=".65" stop-color="#db9c60"/><stop offset="1" stop-color="#bd7d53"/></linearGradient><linearGradient id="icing" x2="0" y2="1"><stop stop-color="#f6b6ce"/><stop offset="1" stop-color="#d986ae"/></linearGradient><mask id="hole"><rect x="-140" y="-140" width="280" height="280" fill="white"/><circle r="35" fill="black"/></mask><pattern id="awning" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#f8ead3"/><rect width="25" height="50" fill="#d5a2ba"/></pattern></defs>
 <rect width="1200" height="675" fill="url(#sky)"/><circle cx="161" cy="147" r="54" fill="#fff4cf"/>
 <g fill="#fff9ef" opacity=".7"><ellipse cx="314" cy="177" rx="122" ry="24"/><ellipse cx="372" cy="161" rx="61" ry="31"/><ellipse cx="795" cy="213" rx="108" ry="22"/></g>
 <g stroke="#e0c9ce" stroke-width="3" fill="#f4e4df"><path d="M0 428 V280 Q90 246 180 280 V428Z"/><path d="M207 428 V318 Q297 275 388 318 V428Z"/><path d="M698 428 V307 Q780 276 862 307 V428Z"/></g>
 <path d="M0 467 Q290 434 553 470 T1200 459 V675 H0Z" fill="#e9d4c7"/><path d="M0 546 H1200 V675 H0Z" fill="#f3dfc9"/><path d="M0 548 H1200" stroke="#d8bcb3" stroke-width="4"/><path d="M0 609 H1200 M180 549 L140 675 M460 549 L447 675 M740 549 L757 675 M1020 549 L1060 675" stroke="#e3cbb9" stroke-width="2"/>
 <g id="cards">${[410,650].map((x,i)=>`<g id="card${i}"><g transform="translate(${x} 533)"><path d="M-74 -190 L70 -195 L78 -5 L-72 0Z" fill="#ccb3ad" opacity=".28"/><rect x="-77" y="-212" width="150" height="204" rx="17" fill="#fff9e9" stroke="#bca4b1" stroke-width="4"/><rect x="-32" y="-224" width="60" height="25" rx="9" fill="#9facac"/><rect x="-17" y="-220" width="30" height="8" rx="4" fill="#dce4d7"/>${[0,1,2,3].map(j=>`<g transform="translate(-45 ${-172+j*43})"><rect x="-13" y="-13" width="26" height="26" rx="6" fill="#eee8dc"/>${j<3?check(0,0,.65,'#86a495'):'<rect x="-7" y="-7" width="14" height="14" rx="2" fill="none" stroke="#c78eaa" stroke-width="2.5"/>'}<path d="M27 -4 Q35 -11 44 -4 T64 -4 M27 7 H62" fill="none" stroke="#c4b9ba" stroke-width="4" stroke-linecap="round"/></g>`).join('')}</g></g>`).join('')}</g>
 <g id="scraps">${Array.from({length:20},(_,i)=>`<g id="scrap${i}"><rect x="-15" y="-10" width="30" height="20" rx="4" fill="#fff6de" stroke="#d8c3b8"/>${check(0,0,.55,'#8da99a')}</g>`).join('')}</g>
 <g id="shop"><path d="M929 539 V305 H1173 V539Z" fill="#b5d0c3" stroke="#829f9b" stroke-width="4"/><path d="M920 308 L945 265 H1160 L1185 308Z" fill="url(#awning)" stroke="#b78b9e" stroke-width="3"/><path d="M920 309 Q933 341 947 309 Q960 341 974 309 Q987 341 1001 309 Q1014 341 1028 309 Q1041 341 1055 309 Q1068 341 1082 309 Q1095 341 1109 309 Q1122 341 1136 309 Q1149 341 1163 309 Q1176 341 1185 309" fill="url(#awning)" stroke="#b78b9e" stroke-width="2"/>
 <rect x="927" y="217" width="252" height="53" rx="14" fill="#fff5d9" stroke="#c7a3ad" stroke-width="3"/><text x="1053" y="251" text-anchor="middle" fill="#927082" font-family="ui-rounded,system-ui,sans-serif" font-size="24" font-weight="900" letter-spacing="2">SPRINKLE SHOP</text>
 <rect x="950" y="353" width="97" height="117" rx="15" fill="#e4eee0" stroke="#86a89e" stroke-width="4"/><rect x="1070" y="353" width="78" height="185" rx="14" fill="#729a9a"/><rect x="1080" y="365" width="58" height="112" rx="9" fill="#d7e6d8"/><circle cx="1136" cy="492" r="5" fill="#edc598"/>
 ${[0,1,2].map(i=>`<g transform="translate(${970+i*26} 421)"><rect x="-9" y="-20" width="18" height="42" rx="5" fill="${['#e4b1c8','#c6b6db','#f1d498'][i]}"/><rect x="-10" y="-23" width="20" height="7" rx="3" fill="#94b4a7"/><path d="M-4 -7 L4 -2 M-4 4 L4 9" stroke="#fff3df" stroke-width="3"/></g>`).join('')}
 <g id="hopper"><path d="M960 337 H1038 L1020 382 H980Z" fill="#ecd7ad" stroke="#b69887" stroke-width="3"/><path d="M998 380 Q998 440 950 443" fill="none" stroke="#d5b4b5" stroke-width="16" stroke-linecap="round"/></g></g>
 <g id="burst">${Array.from({length:65},(_,i)=>`<rect id="spray${i}" width="${7+i%4}" height="4" rx="2" fill="${['#fff0a6','#d98fab','#9dcfc5','#b5a5d6','#f9f2e6'][i%5]}"/>`).join('')}</g>
 <ellipse id="shadow" cx="0" cy="542" rx="119" ry="15" fill="#a08080" opacity=".18"/>
 <g id="donut"><g mask="url(#hole)"><circle r="113" fill="url(#dough)" stroke="#bd845d" stroke-width="4"/><path d="M-99 -12 Q-110 -50 -79 -65 Q-64 -100 -29 -92 Q4 -115 33 -94 Q70 -99 81 -66 Q113 -50 98 -17 Q118 18 92 39 Q86 78 52 80 Q25 107 -4 90 Q-39 108 -57 81 Q-96 83 -94 46 Q-117 18 -99 -12Z" fill="url(#icing)" stroke="#cf88a7" stroke-width="3"/><path d="M-76 -47 Q-54 -76 -32 -74" stroke="#ffdbe6" stroke-width="8" stroke-linecap="round" fill="none"/>
 <g id="coating">${Array.from({length:76},(_,i)=>{let a=i*2.39996,r=49+(i*17)%43;return `<rect x="${Math.cos(a)*r}" y="${Math.sin(a)*r}" width="${8+i%4}" height="4" rx="2" transform="rotate(${i*37} ${Math.cos(a)*r} ${Math.sin(a)*r})" fill="${['#fff0a6','#fcf5e5','#95cdc6','#9e93c8','#b86585'][i%5]}"/>`}).join('')}</g></g><circle r="35" fill="none" stroke="#bb7e66" stroke-width="5"/></g>
 <g id="banner"><path d="M164 74 L124 58 V177 L175 153 M1036 74 L1076 58 V177 L1025 153" fill="#c98ca5"/><rect x="164" y="61" width="872" height="111" rx="21" fill="#fff5d9" stroke="#d6a9b8" stroke-width="4"/><text x="600" y="107" text-anchor="middle" fill="#805a79" font-family="ui-rounded,system-ui,sans-serif" font-size="36" font-weight="900" letter-spacing="1">CHORES DO-NUT</text><text x="600" y="150" text-anchor="middle" fill="#805a79" font-family="ui-rounded,system-ui,sans-serif" font-size="36" font-weight="900" letter-spacing="1">STAND A CHANCE</text><text id="child-label" x="600" y="634" text-anchor="middle" fill="#805a79" font-family="system-ui,sans-serif" font-size="22" font-weight="700"></text></g>
 <circle id="wipe" cx="600" cy="338" r="0" fill="#f4dce8"/>`;
 const nodes={};svg.querySelectorAll('[id]').forEach(n=>nodes[n.id]=n);return nodes;},
 render(n,t){const show=(id,v)=>n[id].setAttribute('opacity',v),tr=(id,v)=>n[id].setAttribute('transform',v);
 let x,y=426,rotation,sx=1,sy=1;
 if(t<4.65){let p=phase(t,.2,4.65);x=mix(-145,848,p);rotation=(x+145)/113*180/Math.PI;y-=Math.sin(phase(t,2.14,2.75)*Math.PI)*18+Math.sin(phase(t,3.18,3.83)*Math.PI)*18;}
 else if(t<5.1){let p=phase(t,4.65,5.1);x=848+Math.sin(p*Math.PI)*17;sx=1-Math.sin(p*Math.PI)*.14;sy=1+Math.sin(p*Math.PI)*.1;rotation=993/113*180/Math.PI;}
 else {let p=ease(phase(t,5.1,7.7));x=mix(848,323,p);rotation=(x+145)/113*180/Math.PI;y-=Math.sin(p*Math.PI*4)*5*(1-p);}
 tr('donut',`translate(${x} ${y}) scale(${sx} ${sy}) rotate(${rotation})`);n.shadow.setAttribute('cx',x);show('coating',phase(t,4.83,5.25));
 for(let i=0;i<2;i++){let p=ease(phase(t,i?3.22:2.14,i?3.63:2.55));tr('card'+i,`translate(${(i?650:410)*(-p*.08)} ${533*p*.94}) scale(${1+p*.08} ${1-p*.94})`);show('card'+i,1-p*.45)}
 for(let i=0;i<20;i++){let second=i>=10,p=phase(t,second?3.26:2.18,second?4.2:3.12);show('scrap'+i,Math.sin(p*Math.PI));tr('scrap'+i,`translate(${(second?650:410)+(i%10-4.5)*27*p} ${492-Math.sin(p*Math.PI)*(70+i%3*30)+p*45}) rotate(${i*15+p*260})`)}
 let hit=t>=4.65&&t<5.5?Math.sin((t-4.65)*37)*6*(1-phase(t,4.65,5.5)):0;tr('shop',`translate(${hit} 0) rotate(${hit*.12} 1050 540)`);
 for(let i=0;i<65;i++){let p=phase(t,4.72+i%9*.028,5.6+i%9*.035);show('spray'+i,Math.sin(p*Math.PI));tr('spray'+i,`translate(${950-(80+i%13*15)*p} ${443-Math.sin(p*Math.PI)*(65+i%7*17)+p*85}) rotate(${p*330+i*29})`)}
 show('banner',phase(t,5.65,6));tr('banner',`translate(0 ${-195*(1-ease(phase(t,5.65,6.15)))})`);n.wipe.setAttribute('r',ease(phase(t,8.35,9))*740);
 }
}};
class CelebrationPlayer{
 constructor(svg,{sceneId='donut-chore-crusher',colorVariation='strawberry',childName='',loop=true,onStateChange=()=>{}}={}){
 if(!scenes[sceneId])throw new Error('Unknown celebration scene');
 this.svg=svg;this.scene=scenes[sceneId];this.loop=loop;this.onStateChange=onStateChange;this.time=0;this.running=false;this.destroyed=false;this.visible=true;this.frame=0;this.last=null;this.announced=false;
 const p=palettes[colorVariation]||palettes.strawberry;Object.entries(p).forEach(([k,v])=>svg.style.setProperty('--'+k,v));this.nodes=this.scene.mount(svg);this.nodes['child-label'].textContent=childName?`Well done, ${String(childName).slice(0,32)}!`:'';
 this.motion=matchMedia('(prefers-reduced-motion: reduce)');
 this.tick=now=>{this.frame=0;if(!this.canRun()){this.last=null;return}if(this.last!==null)this.time+=(now-this.last)/1000;this.last=now;if(this.time>=this.scene.duration){if(this.loop){this.time%=this.scene.duration;this.announced=false}else{this.time=7.8;this.running=false;this.onStateChange(false)}}this.render();this.schedule();};
 this.onVisibility=()=>{this.cancel();this.schedule()};this.onMotion=()=>{this.cancel();if(this.motion.matches){this.time=7.8;this.render()}else if(this.running){this.time=0;this.render();this.schedule()}this.onStateChange(this.running&&!this.motion.matches)};
 document.addEventListener('visibilitychange',this.onVisibility);this.motion.addEventListener('change',this.onMotion);
 this.observer=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;this.cancel();this.schedule()});this.observer.observe(svg);
 this.onPageHide=()=>this.destroy();window.addEventListener('pagehide',this.onPageHide,{once:true});this.render();this.play();
 }
 canRun(){return this.running&&!this.destroyed&&this.visible&&!document.hidden&&!this.motion.matches}
 schedule(){if(this.canRun()&&!this.frame)this.frame=requestAnimationFrame(this.tick)}
 cancel(){cancelAnimationFrame(this.frame);this.frame=0;this.last=null}
 render(){this.scene.render(this.nodes,this.time,this.svg);if(this.time>=5.6&&!this.announced){document.getElementById('announcement').textContent=this.scene.description;this.announced=true}}
 play(){if(this.destroyed)return;this.running=true;if(this.motion.matches){this.time=7.8;this.render()}this.onStateChange(!this.motion.matches);this.schedule()}
 pause(){if(this.destroyed)return;this.running=false;this.cancel();this.onStateChange(false)}
 replay(){if(this.destroyed)return;this.cancel();this.time=this.motion.matches?7.8:0;this.announced=false;this.render();this.play()}
 destroy(){if(this.destroyed)return;this.pause();this.destroyed=true;this.observer.disconnect();document.removeEventListener('visibilitychange',this.onVisibility);this.motion.removeEventListener('change',this.onMotion);window.removeEventListener('pagehide',this.onPageHide);this.onDestroy?.()}
}
window.CelebrationPlayer=CelebrationPlayer;window.celebrationScenes=scenes;
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
const pauseButton=document.getElementById('pause');
const player=new CelebrationPlayer(document.getElementById('scene'),{onStateChange:playing=>{pauseButton.textContent=playing?'Pause':'Play';pauseButton.setAttribute('aria-label',playing?'Pause animation':'Play animation')}});
window.donutPlayer=player;
const toggle=()=>player.running&&!player.motion.matches?player.pause():player.play();const replay=()=>player.replay();
pauseButton.addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',replay);player.onDestroy=()=>{pauseButton.removeEventListener('click',toggle);document.getElementById('replay').removeEventListener('click',replay)};
</script></body></html>
